  usp:      { name: 'USP-S',      price: 0,    dmg: 30, rpm: 320, mag: 12, reload: 2.0, spread: 0.9, auto: false, type: 'pistol', snd: 'usp', recoil: 0.006, vel: 280 },
  deagle:   { name: 'Desert Eagle', price: 700, dmg: 52, rpm: 260, mag: 7,  reload: 2.0, spread: 1.4, auto: false, type: 'pistol', snd: 'deagle', recoil: 0.028, vel: 320 },
  nova:     { name: 'Nova',       price: 1100, dmg: 32, rpm: 70,  mag: 8,  reload: 2.8, spread: 3.2, auto: false, type: 'shotgun', snd: 'nova', recoil: 0.016, pellets: 6, vel: 240 },
  p90:      { name: 'P90',        price: 2350, dmg: 24, rpm: 850, mag: 50, reload: 3.2, spread: 1.6, auto: true,  type: 'smg', snd: 'p90', recoil: 0.004, vel: 330 },
  mp9:      { name: 'MP9',        price: 1250, dmg: 26, rpm: 800, mag: 30, reload: 2.6, spread: 1.4, auto: true,  type: 'smg', snd: 'mp9', recoil: 0.005, vel: 325 },
  tec9:     { name: 'Tec-9',      price: 1250, dmg: 25, rpm: 500, mag: 18, reload: 2.6, spread: 1.3, auto: false, type: 'smg', snd: 'tec9', recoil: 0.007, vel: 300 },
  m4:       { name: 'M4A4',       price: 3100, dmg: 33, rpm: 600, mag: 30, reload: 3.1, spread: 0.8, auto: true,  type: 'rifle', snd: 'm4', recoil: 0.011, vel: 390 },
  ak47:     { name: 'AK-47',      price: 2700, dmg: 36, rpm: 600, mag: 30, reload: 3.4, spread: 0.9, auto: true,  type: 'rifle', snd: 'ak', recoil: 0.013, vel: 380 },
  aug:      { name: 'AUG',        price: 3300, dmg: 32, rpm: 667, mag: 30, reload: 3.0, spread: 0.7, auto: true,  type: 'rifle', snd: 'aug', recoil: 0.009, vel: 395 },
  famas:    { name: 'FAMAS',      price: 2050, dmg: 30, rpm: 700, mag: 25, reload: 3.0, spread: 0.8, auto: true,  type: 'rifle', snd: 'famas', recoil: 0.009, vel: 385 },
  sg553:    { name: 'SG 553',     price: 3000, dmg: 38, rpm: 400, mag: 30, reload: 3.2, spread: 0.85, auto: true, type: 'rifle', snd: 'ak', recoil: 0.013, vel: 380 },
  awp:      { name: 'AWP',        price: 4750, dmg: 110, rpm: 42, mag: 5, reload: 3.7, spread: 1.6, auto: false, type: 'sniper', snd: 'awp', recoil: 0.05, vel: 470 },
  knife:    { name: 'Knife',      price: 0,    dmg: 45, rpm: 60,  mag: -1, reload: 0,   spread: 0,   auto: false, type: 'melee', snd: 'knife', recoil: 0, range: 2.0 },
};
const RIFLES_CT = ['m4', 'aug', 'famas'];
const RIFLES_T = ['ak47', 'sg553', 'm4'];

/* ---------------- game ---------------- */

function makeGame(world, opts = {}) {
  const seed = opts.seed ?? 1337;
  const rng = makeRng(seed);
  const G = {
    world, rng, opts,
    time: 0,
    players: [],
    nextId: 1,
    // round state
    roundNum: 0,
    side: TEAM.CT,               // side that starts as T (alternates)
    tWins: 0, ctWins: 0,         // per-TEAM match score (teams alternate roles each round)
    phase: 'prematch',           // prematch | freeze | live | plant | defuse | over
    phaseTime: 0,
    roundOverT: 0,
    overMsg: '',
    overSub: '',
    // effects pools
    tracers: [],                 // {x0,y0,z0,x1,y1,z1,life}
    projectiles: [],             // live bullets: {x,y,z,vx,vy,vz,dmg,owner,wep,pen,life}
    impacts: [],                 // {x,y,z,nx,ny,nz,life,kind}
    puffs: [],                   // particles: {x,y,z,vx,vy,vz,life,size,cr,cg,cb,type}
    feed: [],                    // kill feed strings
    sounds: [],                  // world events: {x,y,z,kind,team,life}
    bomb: null,
    droppedBomb: null,           // {x,y} while the C4 lies on the ground
    dropSeq: 0,
    pools: [],                   // blood pools: {x,y,r,t}
    scorches: [],                // explosion scars: {x,y,r,t,max} — persist through the round
    shake: 0,
    roundsToWin: opts.roundsToWin || 16,
    matchOver: false, matchWinner: null,
    lastKiller: null,
    // bot time-slicing
    aiClock: 0,
    aiSlice: 0,
    // stats for docs
    stats: { steps: 0, alloc: 0 },
  };
  G.flowCache = new Map();

  // ---------- players ----------
  const spawnPos = (role, i) => {
    const list = world.spawns[role === 1 ? 't' : 'ct'];
    const [sx, sy] = list[i % list.length];
    return { x: sx + rng.range(-0.3, 0.3), y: sy + rng.range(-0.3, 0.3) };
  };

  G.newPlayer = (name, team, isBot) => {
    const p = {
      id: G.nextId++,
      name, team, isBot,
      x: 0, y: 0, z: 0,
      vx: 0, vy: 0, vz: 0,
      yaw: 0, pitch: 0,
      hp: 100, armor: 0,
      money: 800,
      weapon: team === TEAM.CT ? 'usp' : 'glock',
      weapon2: 'knife',
      ammo: WEAPONS[team === TEAM.CT ? 'usp' : 'glock'].mag,
      ammoReserve: (team === TEAM.CT ? 'usp' : 'glock') === 'knife' ? 0 : (team === TEAM.CT ? 24 : 120),
      reloading: 0,
      fireCd: 0,
      crouch: false,
      alive: true,
      kills: 0, deaths: 0, assists: 0,
      // bot brain
      role: null,
      taskPos: null, taskFlow: null,
      thinkT: rng.range(0, 0.3),
      mem: [],            // heard/saw events: {x,y,team,t}
      lastSeen: null,     // {x,y,enemyId,t}
      panic: 0,
      moveNoise: rng.range(0, 6.28),
      // render interpolation
      px: 0, py: 0, pyaw: 0, walkPhase: 0, moving: false,
      kick: 0,
      scoped: false,
      // inventory: per-weapon ammo cache + slot mapping (1 primary / 2 sidearm / 3 knife)
      inv: {}, primary: null, sidearm: team === TEAM.CT ? 'usp' : 'glock', lastWeapon: null,
      rebuy: null,
      // input (human)
      input: { fwd: 0, strafe: 0, jump: false, crouch: false, fire: false, reload: false, buy: null },
    };
    G.players.push(p);
    return p;
  };

  const isTThisRound = (p) => p.team === G.side;
  const posOf = (p) => {
    const idx = G.players.filter(q => q.team === p.team).indexOf(p);
    return spawnPos(isTThisRound(p) ? 1 : 0, idx);
  };

  const giveDefaults = (p) => {
    const pistol = p.team === TEAM.CT ? 'usp' : 'glock';
    p.weapon = pistol;
    p.ammo = WEAPONS[pistol].mag;
    p.ammoReserve = p.team === TEAM.CT ? 24 : 120;
    p.armor = 0;
    p.inv = { [pistol]: { ammo: p.ammo, reserve: p.ammoReserve } };
    p.primary = null; p.sidearm = pistol; p.lastWeapon = null;
    p.scoped = false;
  };

  G.startMatch = (opts = {}) => {
    G.players.length = 0;
    const ctNames = ['Vance', 'Okafor', 'Reyes', 'Lindqvist', 'Moreau'];
    const tNames = ['Duran', 'Kovac', 'Petrescu', 'Nakamura', 'Suleiman'];
    for (let i = 0; i < 5; i++) G.newPlayer(i === 0 && opts.human ? 'YOU' : ctNames[i], TEAM.CT, !(i === 0 && opts.human));
    for (let i = 0; i < 5; i++) G.newPlayer(tNames[i], TEAM.T, true);
    G.human = opts.human ? G.players[0] : null;
    G.roundNum = 0;
    G.tWins = 0; G.ctWins = 0;
    G.matchOver = false; G.matchWinner = null;
    G.side = TEAM.CT; // first map: CT starts T in CS2? Actually T starts on side T... alternate each round.
    G.nextRound();
  };

  G.nextRound = () => {
    G.roundNum++;
    // alternate who plays T: in CS2 teams are fixed sides per map; here the *side* (T/CT role) alternates each round for variety
    G.side = G.side === TEAM.CT ? TEAM.T : TEAM.CT;
    // spawn
    let idxT = 0, idxCT = 0;
    for (const p of G.players) {
      p.hp = 100; p.armor = 0; p.alive = true;
      p.kills = p.kills; p.deaths = p.deaths;
      p.reloading = 0; p.fireCd = 0; p.panic = 0; p.kick = 0;
      p.mem.length = 0; p.lastSeen = null;
      p.lane = null; p.rotateAt = 0;
      p.helmet = false; p.kit = false; p.vrecoil = 0; p.hrecoil = 0; p.blindT = 0;
      p.nades = { he: 0, flash: 0, smoke: 0 };
      p.focus = null; p.burstLeft = undefined;
      giveDefaults(p);
      const isT = p.team === G.side ? true : p.team !== G.side;
      // NOTE: side assignment: the round "side" determines which TEAM is T this round.
      const pos = posOf(p);
      p.x = pos.x; p.y = pos.y; p.z = 0;
      p.vx = p.vy = p.vz = 0;
      p.px = p.x; p.py = p.y; p.pyaw = p.yaw;
      p.yaw = p.team === G.side ? 2.4 : -0.9; // face roughly inward
      if (p === G.human) p.yaw = Math.atan2(22 - p.y, 22 - p.x); // human faces map center
      p.pitch = 0;
      // roles for bots
      if (p.isBot) {
        const roleIdx = (G.players.filter(q => q.team === p.team).indexOf(p));
        const roles = ['entry', 'entry', 'anchor', 'support', 'lurker'];
        p.role = roles[roleIdx];
      }
      // money
      if (G.roundNum === 1) p.money = 800;
      p.money = Math.min(16000, p.money);
      // human quality-of-life: auto-rebuy last chosen primary + armor if affordable
      if (p === G.human && p.rebuy && p.money >= WEAPONS[p.rebuy].price) G.buy(p, p.rebuy);
      if (p === G.human && p.money >= 1000) G.buyArmor(p);
    }
    G.bomb = null;
    G.nades.length = 0;
    G.smokes.length = 0;
    G.droppedBomb = null;
    G.pools.length = 0;
    G.plantProg = 0; G.defuseProg = 0;
    G.phase = 'freeze';
    G.phaseTime = 0;
    G.roundOverT = 0;
    G.overMsg = '';
    G.overSub = G.roundNum === 1 ? 'WELCOME TO SIROCCO — FIRST BLOOD WINS RESPECT' : '';
    G.liveT = 115;
    G.flowCache.clear();
    G.tracers.length = 0; G.impacts.length = 0; G.puffs.length = 0; G.sounds.length = 0;
    G.projectiles.length = 0;
    G.scorches.length = 0;
    for (const p of G.players) { p.bought = false; p.hasBomb = false; }
  };

  /* ---------- flow fields ---------- */
  G.getFlow = (srcs, key) => {
    let f = G.flowCache.get(key);
    if (f) return f;
    const arr = new Float32Array(G.world.navOpen.length);
    const INF = 1e9;
    arr.fill(INF);
    const q = new Int32Array(G.world.nv * G.world.nv);
    let head = 0, tail = 0;
    for (const [wx, wy] of srcs) {
      const i = (wx / MAP.NAV) | 0, j = (wy / MAP.NAV) | 0;
      const c = j * G.world.nv + i;
      if (c >= 0 && c < arr.length && G.world.navOpen[c] && arr[c] > 1e8) { arr[c] = 0; q[tail++] = c; }
    }
    const N4 = G.world.navN;
    while (head < tail) {
      const c = q[head++], d = arr[c], k = c * 4;
      for (let n = 0; n < 4; n++) {
        const nn = N4[k + n];
        if (nn >= 0 && arr[nn] > d + 1) { arr[nn] = d + 1; q[tail++] = nn; }
      }
    }
    G.flowCache.set(key, arr);
    return arr;
  };

  G.flowDirAt = (flow, x, y) => {
    const i = Math.max(0, Math.min(G.world.nv - 1, (x / MAP.NAV) | 0));
    const j = Math.max(0, Math.min(G.world.nv - 1, (y / MAP.NAV) | 0));
    const c = j * G.world.nv + i, k = c * 4;
    let best = flow[c], bi = -1;
    for (let n = 0; n < 4; n++) {
      const nn = G.world.navN[k + n];
      if (nn >= 0 && flow[nn] < best - 0.01) { best = flow[nn]; bi = n; }
    }
    if (bi < 0) return [0, 0];
    // navN order: [i-1(W), i+1(E), j-1(N), j+1(S)] -> world dirs
    return [[-1, 0], [1, 0], [0, -1], [0, 1]][bi];
  };

  const inBuyZone = (p) => {
    const z = G.world.buyZones[p.team === G.side ? 't' : 'ct'];
    if (!z) return false;
    return p.x > z.x && p.x < z.x + z.w && p.y > z.y && p.y < z.y + z.h;
  };

  const otherTeam = (t) => (t === TEAM.CT ? TEAM.T : TEAM.CT);

  /* ---------- weapon switching (1 primary / 2 sidearm / 3 knife / Q last) ---------- */
  G.switchWeapon = (p, slot) => {
    if (!p || !p.alive) return;
    let target = null;
    if (slot === 1) target = p.primary;
    else if (slot === 2) target = p.sidearm;
    else if (slot === 3) target = 'knife';
    else if (slot === 'last') target = p.lastWeapon;
    if (!target || target === p.weapon) return;
    if (target !== 'knife' && !(p.inv && p.inv[target])) return;
    if (p.weapon !== 'knife' && p.inv && p.inv[p.weapon]) { p.inv[p.weapon].ammo = p.ammo; p.inv[p.weapon].reserve = p.ammoReserve; }
    p.lastWeapon = p.weapon;
    p.weapon = target;
    if (target === 'knife') { p.ammo = -1; p.ammoReserve = 0; }
    else { p.ammo = p.inv[target].ammo; p.ammoReserve = p.inv[target].reserve; }
    p.reloading = 0; p.scoped = false;
    p.fireCd = Math.max(p.fireCd, 0.45); // draw time
    G.sound(p.x, p.y, p.z, 'switch', p.team, 6);
  };

  /* ---------- buying ---------- */
  G.buy = (p, wid) => {
    const w = WEAPONS[wid];
    if (!w || w.price === 0) return false;
    if (p.money < w.price) return false;
    if (G.phase !== 'freeze' && !inBuyZone(p)) return false;
    if (w.type === 'rifle' || w.type === 'smg' || w.type === 'shotgun' || w.type === 'sniper' || w.type === 'pistol') {
      p.money -= w.price;
      if (wid !== p.weapon) p.lastWeapon = p.weapon;
      p.weapon = wid;
      p.ammo = w.mag;
      p.ammoReserve = w.mag * 4;
      p.inv = p.inv || {};
      p.inv[wid] = { ammo: p.ammo, reserve: p.ammoReserve };
      if (w.type === 'pistol') p.sidearm = wid; else p.primary = wid;
      p.reloading = 0; p.scoped = false;
      if (p === G.human) p.rebuy = wid;
    }
    return true;
  };
  const GEAR = { kevlar: 650, kevlarhelm: 1000, kit: 400, he: 300, flash: 200, smoke: 300 };
  G.buyGear = (p, id) => {
    const price = GEAR[id];
    if (!price || p.money < price) return false;
    if (G.phase !== 'freeze' && !inBuyZone(p)) return false;
    if (id === 'kevlar') { if (p.armor >= 100) return false; p.armor = 100; }
    else if (id === 'kevlarhelm') { if (p.armor >= 100 && p.helmet) return false; p.armor = 100; p.helmet = true; }
    else if (id === 'kit') { if (p.team === G.side || p.kit) return false; p.kit = true; }
    else {
      const lim = { he: 1, flash: 2, smoke: 1 }[id];
      p.nades = p.nades || { he: 0, flash: 0, smoke: 0 };
      if (p.nades[id] >= lim) return false;
      p.nades[id]++;
    }
    p.money -= price;
    return true;
  };
  G.buyArmor = (p) => {
    if (p.money < 650 || p.armor > 0) return false;
    if (G.phase !== 'freeze' && !inBuyZone(p)) return false;
    p.money -= 650; p.armor = 100;
    return true;
  };

  G.botBuy = (p) => {
    const isT = p.team === G.side;
    const w = G.world;
    const rnd = G.roundNum;
    const awpBot = p.role === 'lurker' && rnd > 2;
    // rifles
    const rifs = isT ? RIFLES_T : RIFLES_CT;
    let want = null;
    if (p.money >= 2500 && rnd > 0) want = rifs[G.rng.int(0, rifs.length - 1)];
    if (awpBot && p.money >= 4750) want = 'awp';
    if (want) G.buy(p, want);
    else if (!G.buy(p, isT ? 'ak47' : 'm4')) {
      // fallback smg
      const smgs = isT ? ['mp9', 'tec9'] : ['p90', 'mp9'];
      for (const s of smgs) if (G.buy(p, s)) break;
    }
    if (p.money > 1400) G.buyArmor(p);
    if (p.money > 2000) G.buyGear(p, 'kevlarhelm');
    if (p.money > 1700 && G.rng.chance(0.55)) G.buyGear(p, 'he');
    if (p.money > 1500 && G.rng.chance(0.45)) G.buyGear(p, 'flash');
    if (p.money > 2400 && G.rng.chance(0.35)) G.buyGear(p, 'smoke');
    if (p.money > 2200 && G.rng.chance(0.3)) G.buy(p, 'deagle');
  };

  /* ---------- movement ---------- */
  G.stepPlayer = (p, dt) => {
    if (!p.alive) return;
    const W = G.world;
    const speedBase = p.crouch ? 2.2 : 4.6;
    const w = WEAPONS[p.weapon];
    const wPenalty = w.type === 'sniper' ? 0.85 : w.type === 'rifle' ? 0.97 : 1;
    const spd = speedBase * wPenalty;
    // input — forward = (cos yaw, sin yaw), strafe-right = (sin yaw, -cos yaw)
    const fwd = p.input.fwd, strafe = p.input.strafe;
    // --- source-style locomotion: ground friction + projection-capped
    // acceleration + limited air control (counter-strafing stops you dead,
    // momentum carries through jumps) ---
    const wishX = Math.cos(p.yaw) * fwd + Math.sin(p.yaw) * strafe;
    const wishY = Math.sin(p.yaw) * fwd - Math.cos(p.yaw) * strafe;
    const wl = Math.hypot(wishX, wishY);
    const onGround = p.z <= 0.01;
    const FRICTION = 7.0, ACC_G = 9.5, ACC_AIR = 1.7, AIR_CAP = 1.15;
    if (wl > 0.001) {
      const invSpd = 1 / (spd || 1);
      const cur = p.vx * wishX * invSpd + p.vy * wishY * invSpd; // vel along wish (unit) dir
      const cap = onGround ? spd : Math.min(spd, AIR_CAP * spd);
      const add = Math.min((onGround ? ACC_G : ACC_AIR) * dt * spd, Math.max(0, cap - cur));
      if (add > 0) { p.vx += wishX / wl * add; p.vy += wishY / wl * add; }
    }
    if (onGround) {
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 0.05) {
        const control = sp < 1.2 ? 2.4 : 1;           // stop power: counter-strafe halts instantly
        const drop = control * FRICTION * dt * sp;
        const ns = Math.max(0, sp - drop) / sp;
        p.vx *= ns; p.vy *= ns;
      } else { p.vx = 0; p.vy = 0; }
    }
    // gravity / jump
    const ground = W.terrH ? 0 : 0;
    if (p.input.jump && p.z <= 0.01) p.vz = 4.4;
    p.vz -= 11 * dt;
    // integrate
    let [nx, ny] = moveCircle(W, p.x, p.y, PLAYER_R, p.vx * dt, p.vy * dt);
    p.x = nx; p.y = ny;
    p.z = Math.max(0, p.z + p.vz * dt);
    if (p.z <= 0 && p.vz < 0) {
      const impact = -p.vz;
      p.vz = 0;
      if (impact > 3) {
        p.landDip = Math.min(0.30, impact * 0.045);   // critically damped camera dip on landing
        if (impact > 7.5) G.shake = Math.max(G.shake, Math.min(0.5, (impact - 7.5) * 0.12));
      }
    }
    if (p.landDip > 0.001) p.landDip *= Math.pow(0.002, dt); else p.landDip = 0;
    // smooth crouch (visual + audio, hitbox stays binary for netcode simplicity)
    p.crouchK = (p.crouchK || 0) + ((p.crouch ? 1 : 0) - (p.crouchK || 0)) * Math.min(1, dt * 12);
    // anim
    const vlen = Math.hypot(p.vx, p.vy);
    p.moving = vlen > 0.8;
    if (p.moving) p.walkPhase += dt * (5 + vlen * 1.4);
    // fire cd / reload
    if (p.fireCd > 0) p.fireCd -= dt;
    if (p.reloading > 0) {
      p.reloading -= dt;
      if (p.reloading <= 0) {
        const ww = WEAPONS[p.weapon];
        const need = ww.mag - p.ammo;
        const take = Math.min(need, p.ammoReserve);
        p.ammo += take; p.ammoReserve -= take;
      }
    }
    // kick decay
    p.kick *= Math.pow(0.001, dt);
    // view recoil recovery + blind decay + nade cooldown
    p.vrecoil = (p.vrecoil || 0) * Math.pow(0.002, dt);
    p.hrecoil = (p.hrecoil || 0) * Math.pow(0.002, dt);
    if (p.blindT > 0) p.blindT -= dt;
    if (p.nadeCd > 0) p.nadeCd -= dt;
    // footsteps (own + nearby bots hear via sound events)
    if (p.moving && vlen > 2.6 && p.z <= 0.01) {
      p.stepT = (p.stepT || 0) - dt * (vlen / 4.6);
      if (p.stepT <= 0) { p.stepT = 0.42; G.sound(p.x, p.y, p.z, 'footstep', p.team, 14); }
    }
    // grenade throw (human: direct key binding calls G.throwNade)
    // hold-interact plant/defuse for the HUMAN (bots use tryPlant/tryDefuse)
    if (p === G.human && p.alive) {
      const b = G.bomb;
      if (p.team === G.side && p.hasBomb && !(b && b.planted)) {
        let inSite = false;
        for (const s of [MAP.SITE_A, MAP.SITE_B]) if (dist2(p.x, p.y, s.x, s.y) < s.r * s.r) inSite = true;
        if (inSite && p.input.interact && G.phase === 'live') {
          G.plantProg = (G.plantProg || 0) + dt;
          if (G.plantProg > 0.1 && G.time - (p.lastPlantSnd || 0) > 0.5) { p.lastPlantSnd = G.time; G.sound(p.x, p.y, 0, 'defuse', p.team); }
          if (G.plantProg >= 3.2) { G.plantProg = 0; G.tryPlant(p); }
        } else G.plantProg = 0;
      } else if (b && b.planted && p.team !== G.side && dist2(p.x, p.y, b.x, b.y) < 1.6 * 1.6) {
        if (p.input.interact) {
          G.defuseProg = (G.defuseProg || 0) + dt * (p.kit ? 2 : 1);
          if (G.time - (p.lastDefSnd || 0) > 0.5) { p.lastDefSnd = G.time; G.sound(p.x, p.y, 0, 'defuse', p.team); }
          if (G.defuseProg >= 5) {
            G.defuseProg = 0;
            b.planted = false;
            G.endRound(p.team, 'CTs DEFUSED', 'The bomb has been defused.');
          }
        } else G.defuseProg = 0;
      } else { G.plantProg = 0; if (!(b && b.planted)) G.defuseProg = 0; }
    }
  };

  G.tryFire = (p, aimX, aimY, spreadMul = 1) => {
    if (!p.alive || p.reloading > 0 || p.fireCd > 0) return;
    if (G.phase === 'freeze') return; // no shooting during buy phase
    const w = WEAPONS[p.weapon];
    if (w.type === 'melee') { G.meleeAttack(p); return; }
    if (w.mag > 0 && p.ammo <= 0) {
      if (p.ammoReserve > 0) { p.reloading = w.reload; G.sound(p.x, p.y, p.z, 'reload', p.team); }
      else return;
    }
    p.fireCd = 60 / w.rpm;
    const isT = p.team === G.side;
    // muzzle
    const mz = 1.35 * (p.crouch ? 0.75 : 1) + p.z;
    const mx = p.x + Math.cos(p.yaw) * 0.55, my = p.y + Math.sin(p.yaw) * 0.55;
    // spread in world-angle
    const moveSpread = Math.hypot(p.vx, p.vy) * 0.14;
    const crouchMul = p.crouch ? 0.6 : 1;
    const airMul = p.z > 0.05 ? 1.8 : 1;
    // scoped snipers are laser-accurate; hip-firing one is a desperate act
    const sniperMul = w.type === 'sniper' ? (p.scoped ? 0.22 : 2.8) : 1;
    const totalSpread = (w.spread * 0.014 + moveSpread * 0.008) * spreadMul * sniperMul * crouchMul * airMul;
    p.kick = Math.min(0.28, p.kick + w.recoil * 6);
    // shoot pellets — each is a REAL projectile now: travel time, gravity
    // drop, geometric headshots, thin-cover penetration. Autos follow a
    // deterministic recoil pattern (climb then sinusoidal drift); shotgun
    // pellets use a golden-angle spiral for even, clump-free coverage.
    const W = G.world;
    const pellets = w.pellets || 1;
    const pitch0 = p.pitch || 0;
    const spd = w.vel || 340;
    const GA = 2.39996; // golden angle
    for (let i = 0; i < pellets; i++) {
      let a, av;
      if (pellets > 1) {
        const pr = Math.sqrt((i + 0.6) / pellets) * totalSpread * 2.4;
        const pa = i * GA + p.yaw * 0.7;
        a = p.yaw + Math.cos(pa) * pr;
        av = pitch0 + Math.sin(pa) * pr * 0.8;
      } else if (w.auto && (p.sprayIdx || 0) > 0) {
        // deterministic pattern: vertical climb ramps in, then lateral drift
        const idx = p.sprayIdx;
        const climb = Math.min(1, idx / 9);
        const vert = (0.35 + 0.65 * climb) * w.recoil * 9;
        const horiz = Math.sin(idx * 0.55 + (w.type === 'rifle' ? 0.8 : 0.2)) * Math.min(1, Math.max(0, (idx - 5) / 6)) * w.spread * 0.011;
        a = p.yaw + horiz + G.rng.gauss() * totalSpread * 0.55;
        av = pitch0 + vert + G.rng.gauss() * totalSpread * 0.55;
      } else {
        a = p.yaw + G.rng.gauss() * totalSpread;
        av = pitch0 + G.rng.gauss() * totalSpread * 0.9;
      }
      const dx = Math.cos(a) * Math.cos(av), dy = Math.sin(a) * Math.cos(av), dz = Math.sin(av);
      G.projectiles.push({
        x: mx, y: my, z: mz,
        vx: dx * spd, vy: dy * spd, vz: dz * spd,
        dmg: w.dmg, owner: p, wep: w, pen: 0, life: 1.1, inside: null,
      });
    }
    p.sprayIdx = (p.sprayIdx || 0) + 1;
    p.lastShotT = G.time;
    // once-per-shot muzzle juice
    G.puffs.push({ x: mx, y: my, z: mz, vx: 0, vy: 0, vz: 0, life: 0.04, size: 0.35, cr: 1.4, cg: 1.1, cb: 0.5, type: 'flash' });
    // brass: one ejected casing (tumbles out to the shooter's right)
    G.puffs.push({
      x: mx - Math.sin(p.yaw) * 0.2, y: my + Math.cos(p.yaw) * 0.2, z: mz,
      vx: -Math.sin(p.yaw) * 2.2 + G.rng.range(-0.4, 0.4), vy: Math.cos(p.yaw) * 2.2 + G.rng.range(-0.4, 0.4), vz: 2.4,
      life: 0.85, size: 0.045, cr: 1.5, cg: 1.15, cb: 0.45, type: 'shell',
    });
    R_FX.muzzle(mx, my, mz, w.type === 'sniper' ? 2.6 : 1.5);
    G.sound(mx, my, mz, 'shot_' + (w.snd || 'ak'), p.team, w.type === 'sniper' ? 40 : 30);
    if (w.mag > 0) p.ammo--;
    // view recoil: climbs with fire, recovers in main loop
    p.vrecoil = Math.min(0.14, (p.vrecoil || 0) + w.recoil * (p.isBot ? 0.4 : 1));
    p.hrecoil = (p.hrecoil || 0) + w.recoil * G.rng.range(-0.4, 0.4) * (p.isBot ? 0.4 : 1);
  };

  /* ---------- projectile ballistics ----------
   * Bullets are simulated bodies: muzzle velocity, gravity drop, substepped
   * sweeps against player capsules (geometric headshots: the bullet's HEIGHT
   * at impact decides, not dice) and wall solids. Thin props (crates, low
   * sandbags) are penetrated once at 45% damage — wallbang skill is real. */
  const BULLET_G = 20;            // arcade-scaled gravity (m/s^2) for drop
  const PLAYER_HEAD_Z = (q) => (q.crouch ? 1.12 : 1.46);
  const segCapsuleHit = (x0, y0, z0, x1, y1, z1, q) => {
    const dx = x1 - x0, dy = y1 - y0;
    const L2 = dx * dx + dy * dy;
    if (L2 < 1e-9) return null;
    const t = clamp(((q.x - x0) * dx + (q.y - y0) * dy) / L2, 0, 1);
    const cx = x0 + dx * t, cy = y0 + dy * t;
    if (dist2(cx, cy, q.x, q.y) > PLAYER_R * PLAYER_R) return null;
    const z = z0 + (z1 - z0) * t;
    if (z < q.z + 0.05 || z > q.z + 1.82) return null;
    return { d: Math.sqrt(dist2(x0, y0, q.x, q.y)), head: z > q.z + PLAYER_HEAD_Z(q), x: cx, y: cy, z };
  };
  const solidAtPoint = (W, x, y) => {
    for (const s of W.solids) {
      if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return s;
    }
    return null;
  };
  const pointInSolid = (s, x, y) => x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h;
  G.stepProjectiles = (dt) => {
    const W = G.world;
    for (let i = G.projectiles.length - 1; i >= 0; i--) {
      const b = G.projectiles[i];
      b.life -= dt;
      let dead = b.life <= 0;
      const sx0 = b.x, sy0 = b.y, sz0 = b.z; // frame-start for the tracer beam
      const speed = Math.hypot(b.vx, b.vy, b.vz);
      const steps = Math.max(1, Math.min(26, Math.ceil((speed * dt) / 0.45)));
      const sdt = dt / steps;
      for (let s = 0; s < steps && !dead; s++) {
        const px = b.x, py = b.y, pz = b.z;
        b.vz -= BULLET_G * sdt;                 // gravity drop
        b.x += b.vx * sdt; b.y += b.vy * sdt; b.z += b.vz * sdt;
        // players first (geometric capsule + height test)
        for (const q of G.players) {
          if (q === b.owner || !q.alive) continue;
          const hit = segCapsuleHit(px, py, pz, b.x, b.y, b.z, q);
          if (!hit) continue;
          const fall = clamp(1 - (hit.d - 12) / 105, 0.5, 1);
          const dmgMul = fall * (hit.head ? 2.6 : 1) * (b.pen > 0 ? 0.7 : 1);
          G.damage(q, b.owner, b.dmg * dmgMul, hit.head);
          G.impacts.push({ x: hit.x, y: hit.y, z: hit.z, nx: -b.vx * 0.01, ny: -b.vy * 0.01, nz: 0.3, life: 0.7, kind: 'blood' });
          dead = true;
          break;
        }
        if (dead) break;
        // solids: height-aware; thin cover is punched through once
        if (b.inside) {
          if (!pointInSolid(b.inside, b.x, b.y)) b.inside = null; // exited the prop
          continue; // no solid collision while inside the penetrated prop
        }
        const sol = (b.x < 2 || b.y < 2 || b.x > W.W - 2 || b.y > W.H - 2) ? { h1: 99 } : solidAtPoint(W, b.x, b.y);
        if (sol && b.z > (sol.h0 || 0) && b.z < sol.h1) {
          const thin = !!sol.kind && (sol.h1 - (sol.h0 || 0)) <= 1.35 && Math.max(sol.w, sol.h) <= 2.4;
          if (thin && b.pen < 1) {
            b.pen++;
            b.dmg *= 0.45;
            b.inside = sol;
            G.impacts.push({ x: b.x, y: b.y, z: b.z, nx: 0, ny: 0, nz: 1, life: 0.5, kind: 'spark' });
          } else {
            G.impacts.push({ x: b.x, y: b.y, z: b.z, nx: -b.vx * 0.01, ny: -b.vy * 0.01, nz: 0.3, life: 0.8, kind: b.wep.type === 'sniper' ? 'big' : 'spark' });
            if (b.z < 0.5) { // low ground hits puff sand
              G.puffs.push({ x: b.x, y: b.y, z: b.z, vx: 0, vy: 0, vz: 0.8, life: 0.3, size: 0.06, cr: 0.8, cg: 0.7, cb: 0.5, type: 'smoke' });
            }
            dead = true;
          }
        }
      }
      if (!dead) G.tracers.push({ x0: sx0, y0: sy0, z0: sz0, x1: b.x, y1: b.y, z1: b.z, life: 0.035 });
      if (dead || b.life <= 0) G.projectiles.splice(i, 1);
    }
  };

  /* melee: short-range arc attack (knife) — used to be an infinite-range hitscan */
  G.meleeAttack = (p) => {
    p.fireCd = 60 / WEAPONS.knife.rpm;
    p.kick = Math.min(0.28, p.kick + 0.05);
    G.sound(p.x, p.y, p.z, 'swing', p.team, 9);
    let best = null, bd = 1e9;
    for (const q of G.players) {
      if (q === p || !q.alive || q.team === p.team) continue;
      const d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d > (WEAPONS.knife.range || 2.0) + PLAYER_R) continue;
      const a = Math.atan2(q.y - p.y, q.x - p.x);
      if (Math.abs(angNorm(a - p.yaw)) > 1.0) continue;
      if (lineBlocked(G.world, p.x, p.y, q.x, q.y)) continue;
      if (d < bd) { bd = d; best = q; }
    }
    if (best) {
      // backstab: striking from inside the victim's rear arc is lethal
      const rel = Math.abs(angNorm(Math.atan2(p.y - best.y, p.x - best.x) - (best.yaw + Math.PI)));
      G.damage(best, p, rel < 0.75 ? 190 : WEAPONS.knife.dmg, false);
      G.sound(best.x, best.y, best.z, 'stab', p.team, 12);
    }
  };

  /* cast ray from (x,y) dir (dx,dy) to capsule at (q.x,q.y) radius r, height 0..1.8; returns hit distance or -1 */
  const castToCapsule = (ox, oy, mx, my, dx, dy, q) => {
    const px = q.x - mx, py = q.y - my;
    const tca = px * dx + py * dy;
    if (tca < 0) return -1;
    const d2 = px * px + py * py - tca * tca;
    const r = PLAYER_R;
    if (d2 > r * r) return -1;
    const thc = Math.sqrt(r * r - d2);
    let t = tca - thc;
    // don't hit self region
    if (t < 0.1) t = tca + thc;
    if (t < 0.1 || t > 120) return -1;
    // height check: bullet at ~1.35 vs body 0..1.8 -> ok
    return t;
  };

  const rayToWall = (W, x, y, dx, dy) => {
    // step 0.15 m max 100
    let px = x, py = y;
    for (let t = 0.15; t < 100; t += 0.15) {
      px = x + dx * t; py = y + dy * t;
      if (px < 2 || py < 2 || px > W.W - 2 || py > W.H - 2) return t;
      const i = (px / MAP.CELL) | 0, j = (py / MAP.CELL) | 0;
      if (W.blocked[j * W.nc + i]) return t;
    }
    return 100;
  };

  /* ---------- damage / death ---------- */
  G.damage = (p, attacker, dmg, head) => {
    if (!p.alive) return;
    if (p.armor > 0 && !head) { const ab = dmg * 0.4; p.armor -= ab; dmg *= 0.6; if (p.armor < 0) p.armor = 0; }
    if (head && p.helmet) { dmg *= 0.6; p.helmet = false; } // helmet eats one headshot
    p.hp -= dmg;
    if (attacker && attacker !== p) {
      if (p === G.human) {
        G.hurtDir = Math.atan2(attacker.x - p.x, attacker.y - p.y); // world angle to attacker
        G.hurtT = 0.9;
        G.shake = Math.max(G.shake, 0.22);
      }
      if (attacker === G.human) {
        G.hitMark = { t: 0.16, head };
        // confirm-the-hit audio: positional at the shooter so only you hear it loudly
        G.sound(attacker.x, attacker.y, attacker.z + 1.4, head ? 'hit_head' : 'hit', attacker.team, 4);
      }
    }
    G.puffs.push({ x: p.x, y: p.y, z: p.z + 1.2, vx: G.rng.range(-1, 1), vy: G.rng.range(-1, 1), vz: 1, life: 0.4, size: 0.08, cr: 0.5, cg: 0.05, cb: 0.05, type: 'smoke' });
    if (attacker) attacker.lastSeen = { x: p.x, y: p.y, t: G.time };
    if (p.isBot && attacker) {
      p.lastSeen = { x: attacker.x, y: attacker.y, t: G.time };
      p.panic = Math.min(1, p.panic + 0.5);
    }
    if (p.hp <= 0) G.kill(p, attacker, head);
  };

  G.kill = (p, attacker, head) => {
    p.alive = false; p.deaths++;
    p.hp = 0; p.scoped = false;
    p.deadT = 0; p.deathYaw = p.yaw;   // collapse animation clock
    // the C4 hits the ground where its carrier fell
    if (p.hasBomb) {
      p.hasBomb = false;
      G.droppedBomb = { x: p.x, y: p.y };
      G.dropSeq++;
      G.sound(p.x, p.y, 0, 'bomb_drop', p.team, 40);
    }
    if (p === G.human) G.lastKiller = attacker ? attacker.name : 'THE DESERT';
    if (attacker) {
      attacker.kills++;
      attacker.money += 300;
      if (attacker.isBot) attacker.lastSeen = { x: p.x, y: p.y, t: G.time };
    }
    const wName = attacker ? WEAPONS[attacker.weapon].name : 'THE MAP';
    G.feed.push({ a: attacker ? attacker.name : '—', d: p.name, w: wName, head, team: attacker ? (attacker.team === G.side ? 'T' : 'CT') : '-', t: G.time });
    if (G.feed.length > 5) G.feed.shift();
    G.sound(p.x, p.y, p.z, 'death', p.team);
    // blood pool marker + death burst
    if (G.pools.length > 23) G.pools.shift();
    G.pools.push({ x: p.x, y: p.y, r: 0.55 + G.rng.range(0, 0.35), t: 15 });
    for (let i = 0; i < 8; i++) {
      G.puffs.push({ x: p.x, y: p.y, z: 1.2, vx: G.rng.range(-2, 2), vy: G.rng.range(-2, 2), vz: G.rng.range(0, 2), life: 0.7, size: 0.07, cr: 0.4, cg: 0.08, cb: 0.06, type: 'smoke' });
    }
    G.checkRoundEnd();
  };

  G.checkRoundEnd = () => {
    if (G.phase !== 'live' && G.phase !== 'plant' && G.phase !== 'defuse') return;
    const tTeam = G.side, ctTeam = otherTeam(G.side);
    const tAlive = G.players.filter(p => p.alive && p.team === tTeam).length;
    const ctAlive = G.players.filter(p => p.alive && p.team === ctTeam).length;
    const planted = G.bomb && G.bomb.planted;
    if (planted && G.bomb.fuse <= 0) {
      // detonation: shockwave + fireball, then the round call
      const b = G.bomb;
      b.fuse = 0; b.planted = false;
      R_FX.explode(b.x, b.y, 0);
      G.shake = Math.max(G.shake, 1.4);
      G.sound(b.x, b.y, 0, 'explosion', tTeam, 200);
      G.endRound(tTeam, 'BOMB DETONATED', 'The bomb detonated at site ' + b.site);
      return;
    }
    if (planted) {
      // while the bomb ticks, elimination alone can't end it: CTs must defuse
      if (ctAlive === 0) G.endRound(tTeam, 'TERRORISTS WIN', 'No one left to defuse the bomb');
    } else {
      if (tAlive === 0) G.endRound(ctTeam, 'CTs WIN', 'All terrorists eliminated');
      else if (ctAlive === 0) G.endRound(tTeam, 'TERRORISTS WIN', 'All counter-terrorists eliminated');
    }
  };

  G.endRound = (winnerTeam, msg, sub) => {
    if (G.phase === 'over' || G.phase === 'match') return;
    // pay
    for (const p of G.players) {
      const won = p.team === winnerTeam;
      p.money += won ? 3250 : 1400;
      p.money = Math.min(16000, p.money);
    }
    if (winnerTeam === TEAM.CT) G.ctWins++; else G.tWins++;
    G.lastWinnerIsT = winnerTeam === G.side;
    if (G.tWins >= G.roundsToWin || G.ctWins >= G.roundsToWin) {
      G.matchOver = true;
      G.matchWinner = winnerTeam;
    }
    G.phase = 'over';

  };

  G.botThink = (p) => {

      else if (p.lane === 'short') { setTarget(25.5, 22); if (Math.hypot(p.x - 25.5, p.y - 22) < 6) setTarget(35, 18); if (Math.hypot(p.x - 35, p.y - 18) < 5 || idleRotate) { setTarget(MAP.SITE_A.x, MAP.SITE_A.y); } }
      else if (p.lane === 'tunnels') { wantB = true; setTarget(11, 34); if (Math.hypot(p.x - 11, p.y - 34) < 6) setTarget(MAP.SITE_B.x, MAP.SITE_B.y); if (idleRotate) wantB = !wantB; }

      if (d2v < 1.2 * 1.2 && d2v > 0.0001) {

        dx += ddx / d * 0.7; dy += ddy / d * 0.7;
      }
    }
    const l = Math.hypot(dx, dy) || 1;
    const mvx = dx / l, mvy = dy / l;
    const yaw = Math.atan2(mvy, mvx);
    p.yaw = angLerp(p.yaw, yaw, 0.25);
    // move: mostly forward, some strafe noise
    const c = Math.cos(p.yaw), s = Math.sin(p.yaw);
    const localF = mvx * c + mvy * s;
    const localS = mvx * s - mvy * c;
    p.input.fwd = clamp(localF * 1.4, -1, 1);
    p.input.strafe = clamp(localS * 1.4, -1, 1);
    p.input.crouch = false;
    // reload when safe
    const ww2 = WEAPONS[p.weapon];
    if (ww2.mag > 0 && p.ammo <= ww2.mag * 0.25 && p.ammoReserve > 0 && p.reloading <= 0) p.input.reload = true;

    // plant / defuse proximity
    if (isT && p.hasBomb) G.tryPlant(p);
    if (!isT) G.tryDefuse(p);

    // footstep sound
    if (p.moving && G.rng.chance(0.02)) G.sound(p.x, p.y, 0, 'step', p.team, 18);
  };

  G.stepBots = (dt) => {
    const bots = G.players.filter(p => p.isBot && p.alive);
    if (!bots.length) return;
    const period = 0.12; // each bot thinks ~8Hz
    G.aiClock += dt;
    while (G.aiClock >= period) {
      G.aiClock -= period;
      const b = bots[G.aiSlice % bots.length];
      G.aiSlice++;
      G.botThink(b);
      if (G.phase === 'over') break;
    }
  };

  /* ---------- main step ---------- */
  G.step = (dt) => {
    G.stats.steps++;
    G.time += dt;
    G.phaseTime += dt;

    // phase machine
    if (G.phase === 'freeze' && G.phaseTime > 6) {
      G.phase = 'live'; G.phaseTime = 0;
      // hand bomb to a T
      const tPlayers = G.players.filter(p => p.alive && p.team === G.side);
      if (tPlayers.length) tPlayers[0].hasBomb = true;
    }
    if (G.phase === 'over') {
      G.roundOverT += dt;
      if (G.roundOverT > 5) {
        if (G.matchOver) G.phase = 'match';
        else G.nextRound();
      }
    }
    if (G.phase === 'match') return; // match over: everything freezes until a new match starts
    if (G.bomb && G.bomb.planted && G.phase === 'plant') {
      G.bomb.fuse -= dt;
      G.phase = 'plant';
      // beep sounds
      if (G.rng.chance(dt * (2 + (35 - G.bomb.fuse) * 0.3))) G.sound(G.bomb.x, G.bomb.y, 0, 'beep', G.side, 30);
    }
    // live round timer
    if ((G.phase === 'live' || G.phase === 'plant')) {
      G.liveT -= dt;
      if (G.liveT <= 0 && !(G.bomb && G.bomb.planted)) {
        G.endRound(otherTeam(G.side), 'CTs WIN', 'Time expired — the bomb was not planted');
      }
    }

    // players
    for (const p of G.players) {
      p.px = p.x; p.py = p.y; p.pyaw = p.yaw;
      if (G.time - (p.lastShotT || -9) > 0.32) p.sprayIdx = 0; // recoil pattern resets between bursts
      if (G.phase === 'freeze') {
        p.vx = p.vy = 0;
        // human buys via the buy menu (B) — no silent auto-buy
        continue;
      }
      if (p.input.reload && p.reloading <= 0) {
        const ww = WEAPONS[p.weapon];
        if (ww.mag > 0 && p.ammo < ww.mag && p.ammoReserve > 0) {
          p.reloading = ww.reload;
          G.sound(p.x, p.y, 0, 'reload', p.team, 14);
        }
      }
      p.input.reload = false;
      G.stepPlayer(p, dt);
      if (p.input.fire && p.alive) {
        const w = WEAPONS[p.weapon];
        // semi-autos need a fresh click; autos fire while held
        if (w.auto || !p.input.heldFire) {
          G.tryFire(p, undefined, undefined);
          p.input.heldFire = true;
        }
      } else {
        p.input.heldFire = false;
      }
      // human plant/defuse now uses hold-E in stepPlayer (progress-based)
    }
    // dropped C4: any alive T walks over it to pick it up
    if (G.droppedBomb && G.phase === 'live') {
      for (const q of G.players) {
        if (!q.alive || q.team !== G.side) continue;
        if (dist2(q.x, q.y, G.droppedBomb.x, G.droppedBomb.y) < 1.3 * 1.3) {
          q.hasBomb = true;
          G.droppedBomb = null;
          G.sound(q.x, q.y, 0, 'pickup', q.team, 24);
          break;
        }
      }
    }
    G.stepBots(dt);
    G.stepProjectiles(dt);
    G.updateEffects(dt);
    G.updateNades(dt);
    G.shake = Math.max(0, G.shake - dt * 1.4);
    if (G.hurtT > 0) G.hurtT -= dt;
    if (G.hitMark && (G.hitMark.t -= dt) <= 0) G.hitMark = null;
    G.checkRoundEnd();
  };

  G.getTPlayers = () => G.players.filter(p => p.alive && p.team === G.side);
  G.getCTPlayers = () => G.players.filter(p => p.alive && p.team !== G.side);

  // fresh match (new rosters, scores, economy) — main re-grabs G.human afterwards
  G.newMatch = () => {
    G.startMatch({ human: !!G.human, seed: (G.rng.next() * 1e9) | 0 });
  };

  return G;
}

    R.cam.ty = cam.y + Math.sin(yaw2) * cpx * lookDist;
    R.cam.tz = cam.z + Math.sin(pitch2) * lookDist;
    G.setCamRef(cam.x, cam.y);

    // 3D viewmodel transform (camera space: +x right, +y up, -z forward)
    if (H && H.alive && !SPECTATE && R.vmBuf && !scoped) {
      R.vmDraw = true;
      const vmW = WEAPONS[H.weapon] || WEAPONS.usp;
      const vmType = vmW.type === 'melee' ? 'knife' : vmW.type;
      R.vmSet(R.vmModels && R.vmModels[vmType] ? vmType : 'rifle');
      const cfg = VM_CFG[vmType] || VM_CFG.rifle;
      // mouse-lag sway (smoothed toward this frame's delta)
      const swayTX = clamp(-input.frameMX * 0.00045, -0.035, 0.035);
      const swayTY = clamp(input.frameMY * 0.00035, -0.025, 0.025);
      swayX += (swayTX - swayX) * Math.min(1, dt * 9);
      swayY += (swayTY - swayY) * Math.min(1, dt * 9);
      input.frameMX = 0; input.frameMY = 0;
      const bob = H.moving ? Math.sin(H.walkPhase * 1.05) * 0.009 : 0;
      const bobX = H.moving ? Math.cos(H.walkPhase * 0.52) * 0.006 : 0;
      const kick = H.kick || 0;
      // reload dip: sine arc that drops and rolls the gun mid-magazine
      const rl = H.reloading > 0 && vmW.reload > 0 ? Math.sin((1 - H.reloading / vmW.reload) * Math.PI) : 0;
      mT(TMP_A, cfg.x + bobX + swayX, cfg.y + bob + swayY - kick * 0.012 - rl * 0.07, cfg.z + kick * 0.05);
      mS(TMP_A, cfg.s);
      mRy(TMP_B, (cfg.ry || 0) + kick * 0.09 - swayX * 1.6 + rl * 0.35);
      M4.mul(R.vmMVP, TMP_A, TMP_B);
      mRz(TMP_B, -0.09 - kick * 0.05 - rl * 0.5);
      M4.mul(TMP_A, R.vmMVP, TMP_B);
      mRx(TMP_B, 0.04 + kick * 0.06 + rl * 0.3);
      M4.mul(R.vmMVP, TMP_A, TMP_B);
      M4.mul(R.vmMVP, R.proj, R.vmMVP);
    } else R.vmDraw = false;

    if (globalThis.__SIM_SKIP) return; // headless fast-forward: sim only, no render

    // audio: consume fresh world sounds relative to camera
    AUD.ingest(G.sounds, cam.x, cam.y, cam.z, cam.yaw);
    // round stingers
    if (G.phase === 'over' && G.overMsg && !stung) {
      stung = true;
      AUD.event(G.lastWinnerIsT ? 'win' : 'lose', 0, 0);
    }
    if (G.phase !== 'over') stung = false;

    // render entities
    R.resetEntities();
    const it = clamp(acc / STEP, 0, 1);
    // explosion scorch scars lie on the ground under everything else
    for (const sc of G.scorches) {
      const k = clamp(sc.t / 6, 0, 1); // fade out over the last 6 s
      R.addScorch(sc.x, sc.y, sc.r, k);
    }
    for (const p of G.players) {
      if (!p.alive && (p.deadT === undefined || p.deadT > 14)) continue;
      if (p === H && H.alive) continue; // first person: don't render own body
      const rx = p.px + (p.x - p.px) * it;
      const ry = p.py + (p.y - p.py) * it;
      if (p.alive) R.addBlobShadow(rx, ry, 0.62, 0.34);
      R.addSoldier({
        x: rx, y: ry,
        yaw: p.pyaw + angNorm(p.yaw - p.pyaw) * it,
        crouch: p.crouch, walkPhase: p.walkPhase, moving: p.moving,
        col: TEAM_COL[p.team].body, suit: TEAM_COL[p.team].suit,
        kick: p.kick,
        dead: !p.alive, deadT: p.deadT || 0,
      });
      if (p.hasBomb) R.billboardQuad(rx, ry, p.z + 0.15, 0.34, 0.34, [0.25, 0.25, 0.28, 1], false);
    }
    if (G.bomb && G.bomb.planted) {
      const b = G.bomb;
      R.billboardQuad(b.x, b.y, 0.22, 0.5, 0.5, [0.18, 0.18, 0.2, 1], false);
      const spd = 2 + (35 - clamp(b.fuse, 0, 35)) * 0.8;
      if (Math.sin(now * 0.004 * spd * 2) > 0.2) {
        R.billboardQuad(b.x, b.y, 0.34, 0.14, 0.14, [2.2, 0.5, 0.25, 1], true);
      }
    }
    // dropped C4 (carrier died): blinking so it reads as urgent
    if (G.droppedBomb) {
      const d = G.droppedBomb;
      R.billboardQuad(d.x, d.y, 0.20, 0.4, 0.4, [0.22, 0.2, 0.16, 1], false);
      if (Math.sin(now * 0.008) > 0) R.billboardQuad(d.x, d.y, 0.30, 0.11, 0.11, [2.0, 0.5, 0.22, 1], true);
    }

    // particles
    R.resetParticles();
    // blood pools: ground-aligned decals under recent kills (culled by range,
    // lifted clear of terrain micro-relief so they never z-fight the floor)
    for (const pl of G.pools) {
      if (dist2(pl.x, pl.y, cam.x, cam.y) > 38 * 38) continue;
      const fade = clamp(pl.t / 3, 0, 1);
      const z = (world.terrH ? world.terrH(pl.x, pl.y) : 0) + 0.06;
      const c = [0.30, 0.04, 0.03, 0.42 * fade];
      const r = pl.r;
      R.addParticleQuad([pl.x - r, pl.y - r, z], [0, 0, 1], c, [pl.x + r, pl.y - r, z], c, [pl.x + r, pl.y + r, z], c, [pl.x - r, pl.y + r, z], c, false);
      const r2 = r * 0.55;
      const z2 = z + 0.006;
      R.addParticleQuad([pl.x + r * 0.4 - r2, pl.y + r * 0.3 - r2, z2], [0, 0, 1], c, [pl.x + r * 0.4 + r2, pl.y + r * 0.3 - r2, z2], c, [pl.x + r * 0.4 + r2, pl.y + r * 0.3 + r2, z2], c, [pl.x + r * 0.4 - r2, pl.y + r * 0.3 + r2, z2], c, false);
    }
    for (const tr of G.tracers) {
      const dx = tr.x1 - tr.x0, dy = tr.y1 - tr.y0, dz = tr.z1 - tr.z0;
      const l = Math.hypot(dx, dy, dz) || 1;
      // start the streak a couple of meters out so shooters don't eat a
      // screen-wide beam, and keep it a thin hot filament
      const sx = tr.x0 + dx / l * 2.2, sy = tr.y0 + dy / l * 2.2, sz = tr.z0 + dz / l * 2.2;
      const nx = dy / l, ny = -dx / l;
      const w = 0.016;
      const a = clamp(tr.life * 14, 0, 0.8);
      R.addParticleQuad(
        [sx, sy, sz], [nx, ny, 0.02], [1.15, 0.9, 0.42, a],
        [tr.x1, tr.y1, tr.z1], [1.15, 0.9, 0.42, a],
        [tr.x1 + nx * w, tr.y1 + ny * w, tr.z1], [0.55, 0.45, 0.22, a * 0.6],
        [sx + nx * w, sy + ny * w, sz], [0.55, 0.45, 0.22, a * 0.6],
        true
      );
    }
    for (const pf of G.puffs) {
      if (pf.type === 'flash') {
        R.billboardQuad(pf.x, pf.y, pf.z, pf.size * 2, pf.size * 2, [pf.cr, pf.cg, pf.cb, 0.9], true);
      } else if (pf.type === 'shell') {
        const a = clamp(pf.life * 1.6, 0, 1);
        R.billboardQuad(pf.x, pf.y, pf.z, pf.size * 1.7, pf.size * 0.7, [pf.cr, pf.cg, pf.cb, 0.95 * a], true);
      } else {
        R.billboardQuad(pf.x, pf.y, pf.z, pf.size * 3, pf.size * 3,
          [pf.cr, pf.cg, pf.cb, 0.15 * clamp(pf.life * 3, 0, 1)], false);
      }
    }
    for (const im of G.impacts) {
      const a = clamp(im.life * 2, 0, 1);
      const col = im.kind === 'blood' ? [0.5, 0.07, 0.05, 0.85 * a]
        : im.kind === 'big' ? [1.5, 1.25, 0.85, 0.95 * a] : [1.3, 1.05, 0.65, 0.85 * a];
      const sz = im.kind === 'big' ? 0.34 : 0.13;
      R.billboardQuad(im.x, im.y, im.z, sz, sz, col, true);
    }
    // smoke clouds: layered soft puffs (alpha pass, no depth write)
    for (const s of G.smokes) {
      const fade = clamp(s.t / 1.5, 0, 1) * clamp((13 - s.t) / 1.5 + 1, 0, 1);
      for (let k = 0; k < 7; k++) {
        const a = k * 2.399963; // golden-angle spiral
        const rr = s.r * (0.35 + 0.13 * (k % 3));
        const zz = 0.5 + (k % 4) * 0.55;
        R.billboardQuad(
          s.x + Math.cos(a) * s.r * 0.42, s.y + Math.sin(a) * s.r * 0.42, zz,
          rr * 2.2, rr * 2.2,
          [0.32, 0.31, 0.30, 0.34 * fade], false
        );
      }
    }

    R.draw();

    // ---- match-over overlay (full stop: rosters frozen until restart) ----
    if (G.phase === 'match') {
      matchT += dt;
      if (SPECTATE) { if (matchT > 6) restartMatch(); }
      else if (matchDiv.style.display !== 'flex') {
        const winName = G.matchWinner === TEAM.CT ? 'COUNTER-TERRORISTS' : 'TERRORISTS';
        const mvp = [...G.players].sort((a, b) => (b.kills || 0) - (a.kills || 0))[0];
        matchDiv.innerHTML = `<div style="text-align:center">
          <div style="font-size:34px;font-weight:800;letter-spacing:4px;color:#ffd97a;text-shadow:0 3px 14px #000">${winName}<br>WIN THE MATCH</div>
          <div style="margin-top:10px;font-size:44px;font-weight:800;letter-spacing:2px">
            <span style="color:#8fd0ff">${G.ctWins}</span>
            <span style="opacity:0.4;font-size:26px;margin:0 14px">—</span>
            <span style="color:#ffc48f">${G.tWins}</span></div>
          <div style="margin-top:8px;font-size:13px;opacity:0.85">MVP · ${mvp ? mvp.name : '—'} (${mvp ? mvp.kills : 0} kills)</div>
          <div style="margin-top:22px;font-size:15px;letter-spacing:2px;color:#9fe87f;animation:odpulse 1.2s infinite">CLICK TO PLAY AGAIN</div>
        </div>`;
        matchDiv.style.display = 'flex';
        try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {}
      }
    } else if (matchDiv.style.display === 'flex') {
      matchDiv.style.display = 'none';
    }

    // banner DOM
    if (banner) {
      banner.t -= dt;
      if (banner.t <= 0) {
        banner = null;
        bannerDiv.style.opacity = '0';
      } else {
        bannerDiv.textContent = banner.text;
        bannerDiv.style.color = banner.color;
        bannerDiv.style.opacity = String(clamp(Math.min(banner.t / 0.25, (banner.dur - banner.t) / 0.15), 0, 1));
      }
    }

    // floating teammate tags (projected through the frame MVP)
    {
      let ti = 0;
      if (H && G.phase !== 'match') {
        for (const p of G.players) {
          if (p === H || !p.alive || p.team !== H.team) continue;
          if (ti >= tagEls.length) break;
          const m = R.mvp;
          const wx = p.x, wy = p.y, wz = p.z + 2.25;
          const cw = m[3] * wx + m[7] * wy + m[11] * wz + m[15];
          if (cw < 0.05) continue;
          const cx2 = (m[0] * wx + m[4] * wy + m[8] * wz + m[12]) / cw;
          const cy2 = (m[1] * wx + m[5] * wy + m[9] * wz + m[13]) / cw;
          const d2p = dist2(p.x, p.y, H.x, H.y);
          if (d2p > 55 * 55) continue;
          const el = tagEls[ti++];
          el.style.display = 'block';
          el.style.left = ((cx2 * 0.5 + 0.5) * (window.innerWidth || 960)) + 'px';
          el.style.top = ((1 - (cy2 * 0.5 + 0.5)) * (window.innerHeight || 540)) + 'px';
          el.innerHTML = `<div style="font-size:10px;letter-spacing:1px;color:#cfe6ff;text-shadow:0 1px 3px #000;white-space:nowrap">${p.hasBomb ? '<span style="color:#ff9a5f">C4 · </span>' : ''}${p.name}</div>` +
            `<div style="width:46px;height:3px;background:rgba(0,0,0,0.6);margin:2px auto 0"><div style="height:100%;width:${clamp(p.hp, 0, 100)}%;background:${p.hp > 50 ? '#8fe87f' : p.hp > 20 ? '#ffce7a' : '#ff7a5f'}"></div></div>`;
        }
      }
      for (; ti < tagEls.length; ti++) tagEls[ti].style.display = 'none';
    }

    // HUD (throttled ~10Hz)
    hudT += dt;
    if (hudT > 0.1) { hudT = 0; updateHUD(); updateMinimap(); if (uiState.buyOpen) refreshBuyMenu(); }

    // per-frame dynamic HUD elements (skip under DOM-less harness stubs)
    const hudDomOk = crossDiv.children && crossDiv.children.length === 4;
    if (hudDomOk && H && H.alive && !SPECTATE) {
      const spd = Math.hypot(H.vx, H.vy);
      const gap = 4 + spd * 1.6 + (H.kick || 0) * 46;
      const scoped2 = !!H.scoped;
      crossDiv.style.display = scoped2 ? 'none' : 'block';
      if (!scoped2) {
        crossDiv.children[0].style.top = (-gap - 7) + 'px';
        crossDiv.children[1].style.top = gap + 'px';
        crossDiv.children[2].style.left = (-gap - 7) + 'px';
        crossDiv.children[3].style.left = gap + 'px';
      }
      hitDiv.style.opacity = G.hitMark ? clamp(G.hitMark.t * 9, 0, 1) : 0;
      hitDiv.style.transform = G.hitMark && G.hitMark.head ? 'scale(1.5)' : 'scale(1)';
      for (const t of hitDiv.children) t.style.background = G.hitMark && G.hitMark.head ? '#ff5f4a' : '#fff';
      if (G.hurtT > 0) {
        const rel = angNorm(G.hurtDir - cam.yaw);
        hurtDiv.style.opacity = clamp(G.hurtT, 0, 0.9);
        hurtDiv.style.transform = `rotate(${rel * 180 / Math.PI}deg)`;
      } else hurtDiv.style.opacity = 0;
      blindDiv.style.opacity = H.blindT > 0 ? clamp(H.blindT, 0, 1) * 0.94 : 0;
      const planting = G.plantProg > 0, defusing = G.defuseProg > 0;
      progDiv.style.display = (planting || defusing) ? 'block' : 'none';
      if (planting) {
        progDiv.querySelector('#progLabel').textContent = 'PLANTING…';
        progDiv.querySelector('#progFill').style.width = clamp(G.plantProg / 3.2 * 100, 0, 100) + '%';
      } else if (defusing) {
        progDiv.querySelector('#progLabel').textContent = 'DEFUSING…';
        progDiv.querySelector('#progFill').style.width = clamp(G.defuseProg / 5 * 100, 0, 100) + '%';
      }
      scopeOv.style.display = scoped2 ? 'block' : 'none';
      // contextual prompt (what you could do right now with E / movement)
      let prompt = '';
      if (G.phase === 'live') {
        if (H.team === G.side && H.hasBomb) {
          let inSite = false;
          for (const s of [MAP.SITE_A, MAP.SITE_B]) if (dist2(H.x, H.y, s.x, s.y) < s.r * s.r) inSite = true;
          if (inSite && !planting) prompt = 'HOLD [E] TO PLANT THE BOMB';
        } else if (H.team !== G.side && G.bomb && G.bomb.planted && !defusing &&
                   dist2(H.x, H.y, G.bomb.x, G.bomb.y) < 1.6 * 1.6) {
          prompt = H.kit ? 'HOLD [E] TO DEFUSE — KIT (2.5s)' : 'HOLD [E] TO DEFUSE (5s)';
        } else if (H.team === G.side && G.droppedBomb) {
          prompt = 'THE BOMB IS DOWN — RETRIEVE IT';
        }
      }
      promptDiv.textContent = prompt;
      promptDiv.style.opacity = prompt ? '0.95' : '0';
    } else {
      crossDiv.style.display = 'none';
      hitDiv.style.opacity = 0;
      hurtDiv.style.opacity = 0;
      blindDiv.style.opacity = 0;
      progDiv.style.display = 'none';
      scopeOv.style.display = 'none';
      promptDiv.style.opacity = '0';
    }
  };

  let vmLastRound = -1;
  // ---- HUD ----
  const hudDiv = document.createElement('div');
  hudDiv.style.cssText = 'position:absolute;inset:0;pointer-events:none;font-family:ui-monospace,Menlo,monospace;color:#fff;user-select:none';
  document.body.appendChild(hudDiv);

  const titleDiv = document.createElement('div');
  titleDiv.style.cssText = 'position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;width:400px';
  hudDiv.appendChild(titleDiv);

  const feedDiv = document.createElement('div');
  feedDiv.style.cssText = 'position:absolute;top:60px;right:14px;font-size:12px;line-height:1.7;text-align:right;text-shadow:0 1px 3px #000';
  hudDiv.appendChild(feedDiv);

  const hintDiv = document.createElement('div');
  hintDiv.style.cssText = 'position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:0.6;text-shadow:0 1px 2px #000';
  hintDiv.textContent = SPECTATE
    ? 'SPECTATING · 10 AI combatants · auto-cinematic camera'
    : 'CLICK TO PLAY · WASD move · MOUSE aim · LMB fire · R reload · CTRL crouch · SPACE jump';
  hudDiv.appendChild(hintDiv);

  // first-person dynamic crosshair (gap widens with movement + firing)
  const crossDiv = document.createElement('div');
  crossDiv.style.cssText = 'position:absolute;left:50%;top:50%;width:0;height:0;display:' + (SPECTATE ? 'none' : 'block');
  crossDiv.innerHTML = `
    <div id="xt" style="position:absolute;left:-1px;width:2px;height:7px;background:rgba(120,255,140,0.9);box-shadow:0 0 3px #000"></div>
    <div id="xb" style="position:absolute;left:-1px;width:2px;height:7px;background:rgba(120,255,140,0.9);box-shadow:0 0 3px #000"></div>
    <div id="xl" style="position:absolute;top:-1px;height:2px;width:7px;background:rgba(120,255,140,0.9);box-shadow:0 0 3px #000"></div>
    <div id="xr" style="position:absolute;top:-1px;height:2px;width:7px;background:rgba(120,255,140,0.9);box-shadow:0 0 3px #000"></div>`;
  hudDiv.appendChild(crossDiv);

  // hitmarker (X flash on confirmed hits)
  const hitDiv = document.createElement('div');
  hitDiv.style.cssText = 'position:absolute;left:50%;top:50%;width:0;height:0;opacity:0';
  hitDiv.innerHTML = `
    <div style="position:absolute;left:-9px;top:-9px;width:7px;height:2px;background:#fff;transform:rotate(45deg)"></div>
    <div style="position:absolute;left:3px;top:-9px;width:7px;height:2px;background:#fff;transform:rotate(-45deg)"></div>
    <div style="position:absolute;left:-9px;top:7px;width:7px;height:2px;background:#fff;transform:rotate(-45deg)"></div>
    <div style="position:absolute;left:3px;top:7px;width:7px;height:2px;background:#fff;transform:rotate(45deg)"></div>`;
  hudDiv.appendChild(hitDiv);

  // directional hurt arc
  const hurtDiv = document.createElement('div');
  hurtDiv.style.cssText = 'position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid transparent;border-top-color:rgba(255,70,50,0.85);opacity:0';
  hudDiv.appendChild(hurtDiv);

  // blind overlay (flashbang)
  const blindDiv = document.createElement('div');
  blindDiv.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none';
  hudDiv.appendChild(blindDiv);

  // sniper scope overlay
  const scopeOv = document.createElement('div');
  scopeOv.style.cssText = 'position:absolute;inset:0;display:none;pointer-events:none;' +
    'background:radial-gradient(circle at 50% 50%, transparent 34%, rgba(0,0,0,0.97) 35.5%)';
  scopeOv.innerHTML = `<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,0.8)"></div>
    <div style="position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,0.8)"></div>
    <div style="position:absolute;left:50%;top:50%;width:76vh;height:76vh;margin:-38vh 0 0 -38vh;border:2px solid rgba(0,0,0,0.85);border-radius:50%"></div>`;
  hudDiv.appendChild(scopeOv);

  // plant/defuse progress bar
  const progDiv = document.createElement('div');
  progDiv.style.cssText = 'position:absolute;left:50%;bottom:26%;transform:translateX(-50%);width:280px;text-align:center;display:none';
  progDiv.innerHTML = `<div id="progLabel" style="font-size:13px;font-weight:700;letter-spacing:2px;text-shadow:0 1px 4px #000;margin-bottom:5px"></div>
    <div style="height:8px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.25)"><div id="progFill" style="height:100%;width:0%;background:#8fe87f"></div></div>`;
  hudDiv.appendChild(progDiv);

  // player status panel (HP / armor / ammo / weapon)
  const statusDiv = document.createElement('div');
  statusDiv.style.cssText = 'position:absolute;bottom:14px;left:14px;font-size:13px;text-shadow:0 1px 3px #000;display:' + (SPECTATE ? 'none' : 'block');
  hudDiv.appendChild(statusDiv);

  // death overlay
  const deadDiv = document.createElement('div');
  deadDiv.style.cssText = 'position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:20px;font-weight:800;letter-spacing:2px;color:#ff7a5f;text-shadow:0 2px 10px #000;display:none;text-align:center';
  hudDiv.appendChild(deadDiv);

  // transient banner ("GO!", "BOMB PLANTED", "MATCH POINT")
  const bannerDiv = document.createElement('div');
  bannerDiv.style.cssText = 'position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:30px;font-weight:800;letter-spacing:4px;text-shadow:0 3px 14px #000;opacity:0;transition:opacity 0.12s;white-space:nowrap';
  hudDiv.appendChild(bannerDiv);

  // contextual action prompt ("HOLD [E] TO PLANT…")
  const promptDiv = document.createElement('div');
  promptDiv.style.cssText = 'position:absolute;left:50%;bottom:33%;transform:translateX(-50%);font-size:15px;font-weight:700;letter-spacing:2px;color:#ffe9b0;text-shadow:0 2px 8px #000;opacity:0;white-space:nowrap';
  hudDiv.appendChild(promptDiv);

  // floating teammate tags
  const tagEls = [];
  for (let i = 0; i < 4; i++) {
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;transform:translate(-50%,-100%);display:none;text-align:center;pointer-events:none';
    hudDiv.appendChild(el);
    tagEls.push(el);
  }

  // match-over overlay (click to restart)
  const matchDiv = document.createElement('div');
  matchDiv.style.cssText = 'position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;background:rgba(8,7,5,0.72);z-index:30';
  hudDiv.appendChild(matchDiv);
  matchDiv.onclick = () => { if (G.phase === 'match') restartMatch(); };

  // pause / settings panel — shows whenever the pointer is unlocked mid-match
  const pauseDiv = document.createElement('div');
  pauseDiv.style.cssText = 'position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,7,5,0.55);pointer-events:auto;z-index:25';
  pauseDiv.innerHTML = `<div style="background:rgba(12,14,16,0.94);border:1px solid rgba(255,255,255,0.14);padding:22px 30px;min-width:380px;font-size:13px">
    <div style="text-align:center;font-weight:800;letter-spacing:3px;font-size:16px;margin-bottom:4px">PAUSED</div>
    <div style="text-align:center;opacity:0.6;font-size:11px;margin-bottom:16px">the match keeps running — click resume to dive back in</div>
    <label style="display:block;margin:10px 0">MOUSE SENSITIVITY <span id="sensVal" style="color:#9fe87f;float:right"></span>
      <input id="sensSlider" type="range" min="20" max="300" value="100" style="width:100%"></label>
    <label style="display:block;margin:10px 0">MASTER VOLUME <span id="volVal" style="color:#9fe87f;float:right"></span>
      <input id="volSlider" type="range" min="0" max="100" value="80" style="width:100%"></label>
    <label style="display:block;margin:10px 0">FIELD OF VIEW <span id="fovVal" style="color:#9fe87f;float:right"></span>
      <input id="fovSlider" type="range" min="60" max="110" value="75" style="width:100%"></label>
    <div style="margin-top:14px;text-align:center"><span id="resumeBtn" style="display:inline-block;background:#2c3a2c;border:1px solid #4a6a4a;color:#9fe87f;font-weight:700;letter-spacing:2px;padding:8px 26px;cursor:pointer">RESUME</span></div>
    <div style="margin-top:14px;opacity:0.55;font-size:11px;line-height:1.8;text-align:center">
      WASD move · MOUSE aim · LMB fire · R reload · 1/2/3 weapons · Q last<br>
      E plant/defuse · G/F/V grenades · B buy (freeze) · TAB score · M mute</div>
  </div>`;
  hudDiv.appendChild(pauseDiv);

  function updateOverlays() {
    // only after the very first capture — a fresh page shows the arena, not a panel
    const showPause = input.everLocked && !input.pointerLocked && !uiState.buyOpen && !SPECTATE && G.phase !== 'match';
    pauseDiv.style.display = showPause ? 'flex' : 'none';
  }
  function restartMatch() {
    G.newMatch();
    H = G.human;
    camPitch = -0.06;
    if (H) H.pitch = camPitch;
    stung = false; vmLastRound = -1; matchT = 0;
    banner = null; bannerDiv.style.opacity = '0';
    prevPhase = G.phase; prevPlanted = false; prevRound = G.roundNum;
    deadDiv.style.display = 'none';
    matchDiv.style.display = 'none';
    uiState.everOpenedBuy = false; uiState.buyOpen = false;
    refreshBuyMenu(); refreshScoreboard();
    updateOverlays();
    relock();
  }
  function settingsUI() {
    if (!pauseDiv.querySelector) return; // headless DOM stubs
    const s = pauseDiv.querySelector('#sensSlider'), v = pauseDiv.querySelector('#volSlider'), f = pauseDiv.querySelector('#fovSlider');
    if (!s || !s.addEventListener) return;
    s.value = String(Math.round(settings.sens * 100));
    v.value = String(Math.round(settings.vol * 100));
    f.value = String(Math.round(settings.fov));
    const lbl = () => {
      const sv = pauseDiv.querySelector('#sensVal'), vv = pauseDiv.querySelector('#volVal'), fv = pauseDiv.querySelector('#fovVal');
      if (sv) sv.textContent = settings.sens.toFixed(2) + '×';
      if (vv) vv.textContent = Math.round(settings.vol * 100) + '%';
      if (fv) fv.textContent = Math.round(settings.fov) + '°';
    };
    lbl();
    s.addEventListener('input', () => { settings.sens = parseInt(s.value, 10) / 100; store.set('od_sens', String(settings.sens)); lbl(); });
    v.addEventListener('input', () => { settings.vol = parseInt(v.value, 10) / 100; AUD.setVolume(settings.vol); store.set('od_vol', String(settings.vol)); lbl(); });
    f.addEventListener('input', () => { settings.fov = parseInt(f.value, 10); cam.fov = settings.fov * RAD; store.set('od_fov', String(settings.fov)); lbl(); });
    const rb = pauseDiv.querySelector('#resumeBtn');
    if (rb) rb.onclick = () => { relock(); };
  }
  settingsUI();

  // buy menu (B during freeze) — CS-style columns
  const buyDiv = document.createElement('div');
  buyDiv.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;pointer-events:auto;' +
    'background:rgba(12,14,16,0.92);border:1px solid rgba(255,255,255,0.14);padding:16px 20px;font-size:13px;min-width:560px';
  hudDiv.appendChild(buyDiv);
  const BUY_ITEMS = [
    ['PISTOLS', [['usp', 'USP-S', 0], ['glock', 'Glock-18', 0], ['deagle', 'Desert Eagle', 700]]],
    ['RIFLES / SMG', [['ak47', 'AK-47', 2700], ['m4', 'M4A4', 3100], ['p90', 'P90', 2350], ['awp', 'AWP', 4750]]],
    ['GEAR', [['kevlarhelm', 'Kevlar + Helmet', 1000], ['kevlar', 'Kevlar', 650], ['kit', 'Defuse Kit', 400], ['he', 'HE Grenade', 300], ['flash', 'Flashbang', 200], ['smoke', 'Smoke', 300]]],
  ];
  const NADE_LIM = { he: 1, flash: 2, smoke: 1 };
  function refreshBuyMenu() {
    if (!uiState.buyOpen || !H || !H.alive || G.phase !== 'freeze') { buyDiv.style.display = 'none'; return; }
    buyDiv.style.display = 'block';
    const nades = H.nades || { he: 0, flash: 0, smoke: 0 };
    let rows = '';
    for (const [cat, items] of BUY_ITEMS) {
      rows += `<div style="margin:0 14px"><div style="color:#ffd97a;font-weight:700;letter-spacing:1px;margin-bottom:6px">${cat}</div>`;
      for (const [id, name, price] of items) {
        const afford = H.money >= price;
        const lim = NADE_LIM[id];
        const maxed = lim !== undefined && (nades[id] || 0) >= lim;
        const owned = (id === 'kevlar' && H.armor >= 100) || (id === 'kevlarhelm' && H.armor >= 100 && H.helmet) || (id === 'kit' && H.kit);
        const dim = !afford || maxed || owned;
        rows += `<div class="buyrow" data-id="${id}" style="display:flex;justify-content:space-between;gap:18px;padding:3px 8px;cursor:${dim ? 'default' : 'pointer'};opacity:${dim ? 0.35 : 1}">` +
          `<span>${name}${maxed ? ' <span style="color:#9fe87f">MAX</span>' : owned ? ' <span style="color:#9fe87f">OWNED</span>' : ''}</span>` +
          `<span style="color:${afford ? '#9fe87f' : '#ff7a5f'}">${price === 0 ? 'FREE' : '$' + price}</span></div>`;
      }
      rows += '</div>';
    }
    buyDiv.innerHTML = `<div style="text-align:center;font-weight:800;letter-spacing:3px;margin-bottom:10px">BUY EQUIPMENT` +
      `<span style="color:#9fe87f;margin-left:14px">$${H.money}</span>` +
      `<span style="opacity:0.5;font-size:11px;margin-left:14px">B / ESC to close</span></div>` +
      `<div style="display:flex">${rows}</div>`;
    for (const el of buyDiv.querySelectorAll('.buyrow')) {
      el.onmouseenter = () => { if (el.style.opacity !== '0.35') el.style.background = 'rgba(255,255,255,0.08)'; };
      el.onmouseleave = () => { el.style.background = 'transparent'; };
      el.onclick = () => {
        const id = el.getAttribute('data-id');
        const ok = id === 'kevlar' ? G.buyArmor(H, 650) : id === 'kevlarhelm' ? G.buyGear(H, 'kevlarhelm') : G.buyGear(H, id) || G.buy(H, id);
        if (ok) AUD.event('buy', 0, 0);
        refreshBuyMenu();
      };
    }
  }

  // scoreboard (hold Tab)
  const scoreDiv = document.createElement('div');
  scoreDiv.style.cssText = 'position:absolute;left:50%;top:14%;transform:translateX(-50%);display:none;' +
    'background:rgba(12,14,16,0.9);border:1px solid rgba(255,255,255,0.14);padding:12px 18px;font-size:13px;min-width:520px';
  hudDiv.appendChild(scoreDiv);
  function refreshScoreboard() {
    if (!uiState.scoreOpen) { scoreDiv.style.display = 'none'; return; }
    scoreDiv.style.display = 'block';
    const rows = [...G.players].sort((a, b) => (b.kills || 0) - (a.kills || 0)).map((p) =>
      `<tr style="opacity:${p.alive ? 1 : 0.45}">` +
      `<td style="padding:2px 14px 2px 0;color:${p === H ? '#ffd97a' : '#fff'}">${p.name}${p === H ? ' (YOU)' : ''}</td>` +
      `<td style="padding:2px 14px;color:${p.team === G.side ? '#ffc48f' : '#8fd0ff'}">${p.team === G.side ? 'T' : 'CT'}</td>` +
      `<td style="padding:2px 14px">${p.kills || 0}</td><td style="padding:2px 14px">${p.deaths || 0}</td>` +
      `<td style="padding:2px 14px;color:#9fe87f">$${p.money || 0}</td>` +
      `<td style="padding:2px 0">${Math.max(0, Math.round(p.hp))}</td></tr>`).join('');
    scoreDiv.innerHTML = `<div style="font-weight:800;letter-spacing:2px;margin-bottom:8px;text-align:center">SIROCCO — SCOREBOARD</div>` +
      `<table style="border-collapse:collapse;width:100%"><tr style="opacity:0.55"><td style="padding-right:14px">PLAYER</td><td style="padding:0 14px">TEAM</td><td style="padding:0 14px">K</td><td style="padding:0 14px">D</td><td style="padding:0 14px">MONEY</td><td>HP</td></tr>${rows}</table>`;
  }

  const miniCanvas = document.createElement('canvas');
  miniCanvas.width = 200; miniCanvas.height = 200;
  miniCanvas.style.cssText = 'position:absolute;top:12px;right:12px;opacity:0.94;background:rgba(22,18,12,0.55);border:1px solid rgba(255,255,255,0.25)';
  hudDiv.appendChild(miniCanvas);
  const miniCtx = miniCanvas.getContext('2d');

  function updateHUD() {
    const tN = G.players.filter(p => p.alive && p.team === G.side).length;
    const cN = G.players.filter(p => p.alive && p.team !== G.side).length;
    const inMatch = G.phase !== 'match';
    let timer = Math.max(0, Math.ceil(G.liveT || 0));
    const tm = Math.floor(timer / 60), ts = (timer % 60).toString().padStart(2, '0');
    let html = `<div style="font-size:24px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 8px #000">
      <span style="color:#8fd0ff">${G.ctWins}</span>
      <span style="color:rgba(255,255,255,0.55);margin:0 12px;font-size:18px">SIROCCO</span>
      <span style="color:#ffc48f">${G.tWins}</span></div>`;
    html += `<div style="font-size:22px;font-weight:700;text-shadow:0 2px 8px #000;color:${timer < 20 ? '#ff8060' : '#fff'}">${inMatch ? tm + ':' + ts : 'MATCH OVER'}</div>`;
    html += `<div style="font-size:12px;opacity:0.85;letter-spacing:1px">ROUND ${G.roundNum} <span style="opacity:0.5">(first to ${G.roundsToWin})</span> &nbsp;·&nbsp; <span style="color:#8fd0ff">CT ${cN}</span> &nbsp;·&nbsp; <span style="color:#ffc48f">T ${tN}</span>`;
    if (G.bomb && G.bomb.planted) html += ` &nbsp;·&nbsp; <span style="color:#ff6048">BOMB SITE ${G.bomb.site} · ${Math.max(0, Math.ceil(G.bomb.fuse))}s</span>`;
    html += `</div>`;
    if (G.phase === 'over') {
      html += `<div style="margin-top:16px;font-size:32px;font-weight:800;letter-spacing:3px;text-shadow:0 3px 12px #000;color:#ffd97a">${G.overMsg}</div>
      <div style="font-size:13px;opacity:0.85">${G.overSub}</div>`;
    } else if (G.phase === 'freeze') {
      const left = Math.max(0, Math.ceil(6 - G.phaseTime));
      html += `<div style="margin-top:8px;font-size:13px;opacity:0.85">BUY PHASE · ${left}s` +
        (H && H.alive ? ` &nbsp;·&nbsp; <span style="color:#9fe87f">PRESS [B] TO BUY — $${H.money}</span>` : '') + `</div>`;
    }
    titleDiv.innerHTML = html;
    feedDiv.innerHTML = G.feed.map(f => {
      const aCol = f.team === 'T' ? '#ffc48f' : f.team === 'CT' ? '#8fd0ff' : '#ddd';
      const dCol = f.team === 'T' ? '#8fd0ff' : '#ffc48f';
      return `<div style="opacity:${clamp(1 - (G.time - f.t) / 6, 0.25, 1)};background:rgba(10,10,10,0.45);padding:1px 6px;border-radius:3px;margin-bottom:2px">
        <span style="color:${aCol};font-weight:700">${f.a}</span> <span style="opacity:0.65">[${f.w}${f.head ? ' · HS' : ''}]</span> <span style="color:${dCol};font-weight:700">${f.d}</span></div>`;
    }).join('');

    // first-person panels
    if (H) {
      const w = WEAPONS[H.weapon] || WEAPONS.usp;
      const ammoStr = w.mag === 0 ? '—' : `${H.ammo} <span style="opacity:0.6;font-size:11px">/ ${H.ammoReserve}</span>`;
      const nades = H.nades || { he: 0, flash: 0, smoke: 0 };
      const nadeStr = [
        nades.he ? `<span style="color:#ffb066">HE×${nades.he}</span>` : '',
        nades.flash ? `<span style="color:#fff3b0">FLASH×${nades.flash}</span>` : '',
        nades.smoke ? `<span style="color:#bfc8cc">SMOKE×${nades.smoke}</span>` : '',
      ].filter(Boolean).join(' ');
      statusDiv.innerHTML = `
        <div style="display:flex;gap:18px;align-items:baseline">
          <span style="font-size:30px;font-weight:800;color:${H.hp > 50 ? '#e8f4e8' : H.hp > 20 ? '#ffce7a' : '#ff7a5f'}">${Math.max(0, Math.round(H.hp))}<span style="font-size:12px;opacity:0.7"> HP</span></span>
          <span style="font-size:15px;opacity:0.85;color:#9fc6e8">${H.armor > 0 ? Math.round(H.armor) + ' AP' + (H.helmet ? '+' : '') : ''}</span>
          <span style="font-size:15px;color:#9fe87f">$${H.money}</span>
          <span style="font-size:12px;opacity:0.9">${nadeStr}${H.kit ? ' <span style="color:#7ad0ff">KIT</span>' : ''}</span>
        </div>
        <div style="margin-top:2px;font-size:15px;font-weight:700;letter-spacing:1px">${w.name.toUpperCase()} &nbsp;<span style="color:#ffd97a">${ammoStr}</span></div>`;
      if (!H.alive) {
        deadDiv.style.display = 'block';
        deadDiv.innerHTML = 'YOU WERE ELIMINATED' +
          (G.lastKiller ? `<br><span style="font-size:13px;font-weight:700;color:#ffd97a">by ${G.lastKiller}</span>` : '') +
          '<br><span style="font-size:12px;font-weight:400;opacity:0.8;letter-spacing:1px">spectating · respawn next round</span>';
      } else {
        deadDiv.style.display = 'none';
      }
      const obj = H.hasBomb
        ? `<span style="color:#ff9a5f">YOU CARRY THE BOMB — reach a bombsite, hold E to plant</span>`
        : (G.droppedBomb && H.team === G.side && H.alive)
          ? `<span style="color:#ff9a5f">THE BOMB IS DOWN — get it back</span>`
          : (G.bomb && G.bomb.planted && H.alive)
            ? `<span style="color:${H.team === G.side ? '#ff9a5f' : '#7ad0ff'}">${H.team === G.side ? 'defend the bomb' : 'DEFUSE THE BOMB — get close, hold E'}</span>` : '';
      if (obj) { hintDiv.innerHTML = obj + '<br><span style="opacity:0.7">WASD move · LMB fire · R reload · 1/2/3 weapons · E interact · G/F/V nades</span>'; }
      else if (H.alive) hintDiv.textContent = 'WASD move · LMB fire · R reload · 1/2/3 weapons · Q last · CTRL crouch · SPACE jump · E plant/defuse';
    }
  }

  // ---- minimap (baked static + dynamic dots) ----
  const miniStatic = document.createElement('canvas');
  miniStatic.width = 200; miniStatic.height = 200;
  (function bake() {
    const s = 200 / MAP.W;
    const ctx = miniStatic.getContext('2d');
    ctx.fillStyle = '#6f6349';
    ctx.fillRect(0, 0, 200, 200);
    for (const site of [MAP.SITE_A, MAP.SITE_B]) {
      ctx.fillStyle = 'rgba(255,185,95,0.30)';
      ctx.beginPath();
      ctx.arc(site.x * s, site.y * s, site.r * s, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#26221a';
    for (const w of world.cols) ctx.fillRect(w.x * s, w.y * s, w.w * s + 1, w.h * s + 1);
    ctx.fillStyle = '#4a4234';
    for (const p of world.props) ctx.fillRect(p.x * s, p.y * s, p.w * s + 1, p.h * s + 1);
    ctx.fillStyle = '#ffe0ae';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('A', MAP.SITE_A.x * s - 5, MAP.SITE_A.y * s + 5);
    ctx.fillText('B', MAP.SITE_B.x * s - 5, MAP.SITE_B.y * s + 5);
  })();

  function updateMinimap() {
    const s = 200 / MAP.W;
    miniCtx.clearRect(0, 0, 200, 200);
    miniCtx.drawImage(miniStatic, 0, 0);
    for (const p of G.players) {
      if (!p.alive) continue;
      const x = p.x * s, y = p.y * s;
      const friendly = p.team === (H ? H.team : G.side);
      miniCtx.fillStyle = friendly ? '#ffb066' : '#66c2ff';
      miniCtx.beginPath();
      miniCtx.arc(x, y, 3, 0, 7);
      miniCtx.fill();
      miniCtx.strokeStyle = miniCtx.fillStyle;
      miniCtx.beginPath();
      miniCtx.moveTo(x, y);
      miniCtx.lineTo(x + Math.cos(p.yaw) * 7, y + Math.sin(p.yaw) * 7);
      miniCtx.stroke();
      // bomb carrier marker (your team only)
      if (p.hasBomb && friendly) {
        miniCtx.strokeStyle = '#ff7040';
        miniCtx.beginPath();
        miniCtx.arc(x, y, 5.5, 0, 7);
        miniCtx.stroke();
      }
    }
    if (G.bomb && G.bomb.planted) {
      miniCtx.fillStyle = '#ff4433';
      miniCtx.fillRect(G.bomb.x * s - 2.5, G.bomb.y * s - 2.5, 5, 5);
    }
    // dropped C4 blinks on the radar
    if (G.droppedBomb && Math.sin(performance.now() * 0.008) > -0.2) {
      miniCtx.fillStyle = '#ff9a40';
      miniCtx.fillRect(G.droppedBomb.x * s - 3, G.droppedBomb.y * s - 3, 6, 6);
      miniCtx.strokeStyle = '#ffd97a';
      miniCtx.strokeRect(G.droppedBomb.x * s - 4.5, G.droppedBomb.y * s - 4.5, 9, 9);
    }
  }

  // boot the loop + headless/screenshot driver (HUD exists by now)
  hudDiv.style.zIndex = '10';
  requestAnimationFrame(frame);
  canvas.__drive = (n) => {
    let t = performance.now();
    for (let i = 0; i < n; i++) renderFrame(t += 16.6);
    updateHUD(); updateMinimap();
  };
  if (typeof location !== 'undefined' && /[?&]sync/.test(location.search || '')) canvas.__drive(30);

  return { G, R, gl, canvas, H };
}


/* ==== boot ==== */
bootGame(canvas);
})();
</script>
</body>
</html>
