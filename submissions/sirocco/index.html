/* ======== src/math.js ======== */
/* math.js — tiny fixed-function math, matrices, noise (no allocs in hot paths) */


const M4 = {
  _tmp: {},
  create: () => new Float32Array(16),
  identity: (o) => {
    o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o;
  },
  mul: (o, a, b) => {
    // (a*b) column-major: out[c*4+i] = sum_k a[k*4+i] * b[c*4+k]
    const r = M4._tmp.mulTarget || (M4._tmp.mulTarget = new Float32Array(16));
    for (let c = 0; c < 4; c++) {
      const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
      for (let i = 0; i < 4; i++) {
        r[c * 4 + i] = a[i] * b0 + a[4 + i] * b1 + a[8 + i] * b2 + a[12 + i] * b3;
      }
    }
    if (o !== r) o.set(r);
    return o;
  },
  // perspective: out, fovy(rad), aspect, near, far
  perspective: (o, fovy, aspect, near, far) => {
    o.fill(0);
    const f = 1 / Math.tan(fovy / 2);
    o[0] = f / aspect; o[5] = f; o[11] = -1;
    const nf = 1 / (near - far);
    o[10] = (far + near) * nf;
    o[14] = 2 * far * near * nf;
    return o;
  },
  // lookAt(out, eye, center, up) — Z-UP world (z = altitude)
  lookAt: (o, ex, ey, ez, cx, cy, cz) => {
    let zx = ex - cx, zy = ey - cy, zz = ez - cz;
    let l = 1 / Math.hypot(zx, zy, zz); zx *= l; zy *= l; zz *= l;
    // up = (0,0,1); right = normalize(cross(up, z)) = (-zy, zx, 0)
    let xx = -zy, xy = zx, xz = 0;
    l = Math.hypot(xx, xy) || 1; xx /= l; xy /= l;
    // y = cross(z, x)
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
    o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
    o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * ex + xy * ey + xz * ez);
    o[13] = -(yx * ex + yy * ey + yz * ez);
    o[14] = -(zx * ex + zy * ey + zz * ez);
    o[15] = 1;
    return o;
  },
};

// value noise (deterministic, hash-based)
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >> 13)) | 0;
  h = (h * 1274126177) | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 3) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); amp *= 0.5; f *= 2.03; }
  return s;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (x0, y0, x1, y1) => { const dx = x1 - x0, dy = y1 - y0; return dx * dx + dy * dy; };

/* angle utils */
const angNorm = (a) => {
  a = a % (Math.PI * 2);
  if (a < -Math.PI) a += Math.PI * 2;
  else if (a > Math.PI) a -= Math.PI * 2;
  return a;
};
const angLerp = (a, b, t) => a + angNorm(b - a) * t;




/* ======== src/rand.js ======== */
/* rand.js — deterministic RNG (mulberry32) for replays/tests */


function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* small game rng wrapper with helpers, all deterministic */
function makeRng(seed) {
  const f = mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[(f() * arr.length) | 0],
    chance: (p) => f() < p,
    gauss: () => (f() + f() + f() - 1.5) / 1.5, // approx normal in [-1,1]
  };
}

/* ---------------- build ---------------- */

function buildWorld() {
  const W = MAP.W, H = MAP.H;
  const cols = [], props = [];
  for (const w of WALLS) cols.push({ x: w[0], y: w[1], w: w[2], h: w[3], h0: w[4] ?? 0, h1: w[5] ?? 3, tex: w[6] ?? 0, name: w[7] || '' });
  for (const p of PROPS) props.push({ x: p[0], y: p[1], w: p[2], h: p[3], h0: p[4], h1: p[5], kind: p[6] });

  const solids = cols.concat(props);

  // collision grid
  const nc = Math.ceil(W / MAP.CELL);
  const blocked = new Uint8Array(nc * nc);
  for (const s of solids) {
    const x0 = Math.floor(s.x / MAP.CELL), y0 = Math.floor(s.y / MAP.CELL);
    const x1 = Math.ceil((s.x + s.w) / MAP.CELL), y1 = Math.ceil((s.y + s.h) / MAP.CELL);
    for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) {
      if (i >= 0 && j >= 0 && i < nc && j < nc) blocked[j * nc + i] = 1;
    }
  }

  // nav grid (walkable cells, 8-way)
  const nv = Math.ceil(W / MAP.NAV);
  const navOpen = new Uint8Array(nv * nv);
  for (let j = 0; j < nv; j++) for (let i = 0; i < nv; i++) {
    const cx = i * MAP.NAV + MAP.NAV / 2, cy = j * MAP.NAV + MAP.NAV / 2;
    const ci = Math.floor(cx / MAP.CELL), cj = Math.floor(cy / MAP.CELL);
    navOpen[j * nv + i] = (ci >= 0 && cj >= 0 && ci < nc && cj < nc && !blocked[cj * nc + ci]) ? 1 : 0;
  }
  // neighbors per cell (for flow fields): 4-way
  const navN = new Int16Array(nv * nv * 4);
  for (let j = 0; j < nv; j++) for (let i = 0; i < nv; i++) {
    const k = (j * nv + i) * 4;
    navN[k] = (i > 0 && navOpen[j * nv + i - 1]) ? j * nv + i - 1 : -1;
    navN[k + 1] = (i < nv - 1 && navOpen[j * nv + i + 1]) ? j * nv + i + 1 : -1;
    navN[k + 2] = (j > 0 && navOpen[(j - 1) * nv + i]) ? (j - 1) * nv + i : -1;
    navN[k + 3] = (j < nv - 1 && navOpen[(j + 1) * nv + i]) ? (j + 1) * nv + i : -1;
  }

  const world = {
    W, H, cols, props, solids,
    nc, blocked,
    nv, navOpen, navN,
    flow: new Float32Array(nv * nv),
    flowDirty: true,
    flowSrc: [],
    spawns: { t: SPAWNS.t, ct: SPAWNS.ct },
    buyZones: BUY_ZONES,
    height: (x, y) => 0,  // flat base; renderer adds micro noise
  };
  return world;
}

/* Line of sight against wall columns only (props block too, cheap check) */
function lineBlocked(world, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy);
  const steps = Math.max(1, Math.ceil(dist / 0.25));
  for (let s = 1; s < steps; s++) {
    const t = s / steps;
    const x = x0 + dx * t, y = y0 + dy * t;
    const i = (x / MAP.CELL) | 0, j = (y / MAP.CELL) | 0;
    if (i < 0 || j < 0 || i >= world.nc || j >= world.nc) continue;
    if (world.blocked[j * world.nc + i]) return true;
  }
  return false;
}

function circleBlocked(world, x, y, r) {
  const x0 = Math.floor((x - r) / MAP.CELL), x1 = Math.ceil((x + r) / MAP.CELL);
  const y0 = Math.floor((y - r) / MAP.CELL), y1 = Math.ceil((y + r) / MAP.CELL);
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
    if (i < 0 || j < 0 || i >= world.nc || j >= world.nc) continue;
    if (!world.blocked[j * world.nc + i]) continue;
    // find rect at this cell region (approx: recheck with cell bounds)
  }
  return false; // placeholder — use circleCollide for physics
}

/* physics: move circle against all solid rects (grid-assisted) */
function moveCircle(world, x, y, r, dx, dy) {
  x += dx;
  // resolve X
  const y0 = Math.floor((y - r) / MAP.CELL), y1 = Math.ceil((y + r) / MAP.CELL);
  for (let j = Math.max(0, y0); j <= Math.min(world.nc - 1, y1); j++) {
    for (let i = Math.max(0, Math.floor((x - r) / MAP.CELL)); i <= Math.min(world.nc - 1, Math.ceil((x + r) / MAP.CELL)); i++) {
      if (!world.blocked[j * world.nc + i]) continue;
      for (const s of world.solidsAt(j, i)) {
        const cx = Math.max(s.x, Math.min(x, s.x + s.w));
        const cy = Math.max(s.y, Math.min(y, s.y + (s.d || s.h)));
        let ddx = x - cx, ddy = y - cy;
        const d2 = ddx * ddx + ddy * ddy;
        if (d2 < r * r) {
          const d = Math.sqrt(d2) || 0.001;
          const push = (r - d) / d;
          x += ddx * push;
          y += ddy * push;
        }
      }
    }
  }
  y += dy;
  const y2 = Math.floor((y - r) / MAP.CELL), y3 = Math.ceil((y + r) / MAP.CELL);
  for (let j = Math.max(0, y2); j <= Math.min(world.nc - 1, y3); j++) {
    for (let i = Math.max(0, Math.floor((x - r) / MAP.CELL)); i <= Math.min(world.nc - 1, Math.ceil((x + r) / MAP.CELL)); i++) {
      if (!world.blocked[j * world.nc + i]) continue;
      for (const s of world.solidsAt(j, i)) {
        const cx = Math.max(s.x, Math.min(x, s.x + s.w));
        const cy = Math.max(s.y, Math.min(y, s.y + (s.d || s.h)));
        let ddx = x - cx, ddy = y - cy;
        const d2 = ddx * ddx + ddy * ddy;
        if (d2 < r * r) {
          const d = Math.sqrt(d2) || 0.001;
          const push = (r - d) / d;
          x += ddx * push;
          y += ddy * push;
        }
      }
    }
  }
  return [x, y];
}

/* build solidsAt lookup: cell -> index range into sorted solids array */
function finalizeWorld(world) {
  const { nc, solids } = world;
  const cellStart = new Int32Array(nc * nc + 1);
  const cellSolid = new Int32Array(0); // placeholder, built below
  // count
  const counts = new Int32Array(nc * nc);
  const ranges = solids.map(s => {
    const x0 = Math.max(0, Math.floor(s.x / MAP.CELL)), y0 = Math.max(0, Math.floor(s.y / MAP.CELL));
    const x1 = Math.min(nc, Math.ceil((s.x + s.w) / MAP.CELL)), y1 = Math.min(nc, Math.ceil((s.y + s.h) / MAP.CELL));
    for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) counts[j * nc + i]++;
    return [x0, y0, x1, y1];
  });
  // prefix
  let sum = 0;
  for (let c = 0; c < nc * nc; c++) { cellStart[c] = sum; sum += counts[c]; }
  cellStart[nc * nc] = sum;
  const idx = new Int32Array(sum);
  const cursor = Int32Array.from(cellStart);
  for (let si = 0; si < solids.length; si++) {
    const [x0, y0, x1, y1] = ranges[si];
    for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) {
      idx[cursor[j * nc + i]++] = si;
    }
  }
  world.solidsAt = (j, i) => {
    const s = cellStart[j * nc + i], e = cellStart[j * nc + i + 1];
    const out = [];
    for (let k = s; k < e; k++) out.push(solids[idx[k]]);
    return out;
  };
  return world;
}

/* flow field: BFS from sources (world.flowSrc = [cellIndex,...]) */
function rebuildFlow(world) {
  const { nv, navOpen, navN, flow, flowSrc } = world;
  const INF = 1e9;
  flow.fill(INF);
  const q = new Int32Array(nv * nv);
  let head = 0, tail = 0;
  for (const c of flowSrc) {
    if (c >= 0 && c < nv * nv && navOpen[c] && flow[c] > 1e8) { flow[c] = 0; q[tail++] = c; }
  }
  while (head < tail) {
    const c = q[head++];
    const d = flow[c];
    const k = c * 4;
    for (let n = 0; n < 4; n++) {
      const nc2 = navN[k + n];
      if (nc2 >= 0 && flow[nc2] > d + 1) { flow[nc2] = d + 1; q[tail++] = nc2; }
    }
  }
  world.flowDirty = false;
}

/* sample flow direction at world pos */
function flowDir(world, x, y) {
  const i = Math.max(0, Math.min(world.nv - 1, (x / MAP.NAV) | 0));
  const j = Math.max(0, Math.min(world.nv - 1, (y / MAP.NAV) | 0));
  const c = j * world.nv + i;
  const k = c * 4;
  let best = flow[c], bi = -1;
  for (let n = 0; n < 4; n++) {
    const nc2 = world.navN[k + n];
    if (nc2 >= 0 && world.flow[nc2] < best - 0.01) { best = world.flow[nc2]; bi = n; }
  }
  if (bi < 0) return [0, 0];
  // navN order: [i-1(W), i+1(E), j-1(N), j+1(S)]
  const dx = [-1, 1, 0, 0][bi], dy = [0, 0, -1, 1][bi];
  const l = Math.hypot(dx, dy);
  return [dx / l, dy / l];
}




/* ======== src/audio.js ======== */
/* audio.js — fully procedural weapon & foley synthesis, zero assets.
   Every sound is built from filtered noise bursts + oscillator envelopes,
   distance-attenuated and low-pass "muffled" by range, stereo-panned by
   the listener's right vector. Lazy-init on first user gesture (autoplay policy). */


function makeAudio() {
  let ctx = null, out = null, noiseBuf = null, muted = false, masterGain = null, volume = 1;
  const consumed = typeof WeakSet !== 'undefined' ? new WeakSet() : null;

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 8; comp.attack.value = 0.002;
    const mg = ctx.createGain();
    mg.gain.value = 0.55 * volume;
    comp.connect(mg); mg.connect(ctx.destination);
    out = comp; masterGain = mg;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate | 0, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // ambient desert wind bed
    const amb = ctx.createBufferSource();
    amb.buffer = noiseBuf; amb.loop = true;
    const af = ctx.createBiquadFilter(); af.type = 'lowpass'; af.frequency.value = 320; af.Q.value = 0.4;
    const ag = ctx.createGain(); ag.gain.value = 0.028;
    amb.connect(af); af.connect(ag); ag.connect(out);
    amb.start();
    return true;
  }

  function chain(node, t0, dur, gain, pan) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(Math.max(0.0001, gain), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    node.connect(g);
    let tail = g;
    if (pan !== undefined && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p); tail = p;
    }
    tail.connect(out);
    return g;
  }

  function noiseHit(t0, dur, freq, q, gain, pan, type) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = 0.9 + Math.random() * 0.2;
    const f = ctx.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    src.connect(f);
    chain(f, t0, dur, gain, pan);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }

  function sweep(t0, dur, f0, f1, gain, pan, wave) {
    const o = ctx.createOscillator();
    o.type = wave || 'sine';
    o.frequency.setValueAtTime(Math.max(1, f0), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    chain(o, t0, dur, gain, pan);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  /* kind: event name; dist: meters from listener; pan: -1..1 */
  function event(kind, dist, pan) {
    if (muted || !init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    const att = Math.max(0, 1 - dist / 48);
    const vol = att * att;
    if (vol < 0.012) return;
    const muffle = Math.exp(-dist * 0.05);           // highs die with distance
    const hi = (f) => 200 + (f - 200) * muffle;
    const t = ctx.currentTime + 0.002;
    const v = (g) => g * vol;
    switch (kind) {
      case 'shot_ak':
        sweep(t, 0.11, hi(150), 55, v(0.85), pan);
        noiseHit(t, 0.1, hi(1700), 0.9, v(0.75), pan);
        noiseHit(t, 0.03, hi(6500), 0.7, v(0.55), pan, 'highpass');
        break;
      case 'shot_m4':
      case 'shot_famas':
      case 'shot_aug':
        sweep(t, 0.09, hi(190), 70, v(0.75), pan);
        noiseHit(t, 0.08, hi(2100), 0.9, v(0.7), pan);
        noiseHit(t, 0.025, hi(7200), 0.7, v(0.5), pan, 'highpass');
        break;
      case 'shot_p90':
      case 'shot_mp9':
        sweep(t, 0.06, hi(230), 95, v(0.6), pan);
        noiseHit(t, 0.05, hi(2600), 1.0, v(0.6), pan);
        noiseHit(t, 0.02, hi(7600), 0.8, v(0.4), pan, 'highpass');
        break;
      case 'shot_tec9':
        sweep(t, 0.07, hi(210), 85, v(0.65), pan);
        noiseHit(t, 0.06, hi(2400), 1.0, v(0.6), pan);
        break;
      case 'shot_nova':
        sweep(t, 0.22, hi(95), 40, v(1.0), pan);
        noiseHit(t, 0.2, hi(600), 0.7, v(0.95), pan);
        noiseHit(t, 0.04, hi(4800), 0.7, v(0.6), pan, 'highpass');
        break;
      case 'shot_awp':
        sweep(t, 0.3, hi(110), 34, v(1.0), pan);
        noiseHit(t, 0.24, hi(750), 0.8, v(0.95), pan);
        noiseHit(t, 0.04, hi(5200), 0.7, v(0.7), pan, 'highpass');
        break;
      case 'shot_deagle':
        sweep(t, 0.16, hi(130), 50, v(0.9), pan);
        noiseHit(t, 0.12, hi(1300), 0.9, v(0.8), pan);
        break;
      case 'shot_glock':
      case 'shot_usp':
        noiseHit(t, 0.05, hi(2400), 1.0, v(0.65), pan);
        noiseHit(t, 0.025, hi(7000), 0.8, v(0.45), pan, 'highpass');
        sweep(t, 0.05, hi(260), 110, v(0.35), pan);
        break;
      case 'step':
      case 'footstep':
        noiseHit(t, 0.05, 260 + Math.random() * 140, 1.2, v(0.16), pan);
        break;
      case 'swing':
        noiseHit(t, 0.09, 900 + Math.random() * 500, 1.6, v(0.28), pan);
        noiseHit(t + 0.03, 0.07, 500, 1.2, v(0.16), pan);
        break;
      case 'stab':
        sweep(t, 0.08, 220, 90, v(0.5), pan);
        noiseHit(t, 0.1, 700, 0.8, v(0.5), pan, 'lowpass');
        break;
      case 'switch':
        noiseHit(t, 0.025, hi(3200), 2.5, v(0.22), pan);
        break;
      case 'hit':
        sweep(t, 0.06, 320, 150, v(0.5), pan, 'triangle');
        noiseHit(t, 0.04, 1100, 1.2, v(0.4), pan);
        break;
      case 'hit_head':
        sweep(t, 0.09, 2500, 1900, v(0.5), pan, 'square');
        noiseHit(t, 0.03, hi(5200), 1.2, v(0.3), pan, 'highpass');
        break;
      case 'buy':
        sweep(t, 0.05, 1300, 1300, v(0.25), pan, 'square');
        sweep(t + 0.07, 0.09, 1950, 1950, v(0.25), pan, 'square');
        break;
      case 'pickup':
        sweep(t, 0.05, 700, 1150, v(0.3), pan, 'triangle');
        break;
      case 'bomb_drop':
        sweep(t, 0.12, 160, 70, v(0.55), pan);
        noiseHit(t + 0.02, 0.08, 500, 1.0, v(0.4), pan, 'lowpass');
        break;
      case 'planted':
        // two-tone alarm, audible everywhere
        for (let k = 0; k < 3; k++) {
          sweep(t + k * 0.22, 0.1, 1600, 1600, 0.3, pan * 0.3, 'square');
          sweep(t + k * 0.22 + 0.11, 0.1, 1180, 1180, 0.3, pan * 0.3, 'square');
        }
        break;
      case 'nade_throw':
        noiseHit(t, 0.12, 1100 + Math.random() * 400, 1.4, v(0.2), pan);
        break;
      case 'nade_bounce':
        sweep(t, 0.04, 900, 500, v(0.22), pan, 'triangle');
        break;
      case 'flash_pop':
        sweep(t, 0.18, hi(3000), 900, v(0.9), pan);
        noiseHit(t, 0.16, hi(5200), 0.8, v(0.85), pan, 'highpass');
        break;
      case 'smoke_hiss':
        noiseHit(t, 1.3, hi(2400), 0.5, v(0.4), pan, 'highpass');
        noiseHit(t, 1.3, hi(500), 0.4, v(0.3), pan, 'lowpass');
        break;
      case 'reload':
        noiseHit(t, 0.03, hi(2800), 2.5, v(0.3), pan);
        noiseHit(t + 0.09, 0.03, hi(2200), 2.5, v(0.3), pan);
        break;
      case 'plant':
        sweep(t, 0.07, 1750, 1750, v(0.35), pan, 'square');
        sweep(t + 0.12, 0.07, 1750, 1750, v(0.35), pan, 'square');
        break;
      case 'defuse':
        sweep(t, 0.09, 950, 720, v(0.3), pan, 'triangle');
        break;
      case 'beep': {
        const urg = Math.min(1, dist / 30);
        sweep(t, 0.05, 2300, 2300, v(0.22 + 0.3 * urg), pan, 'square');
        break;
      }
      case 'death':
        sweep(t, 0.22, hi(330), 70, v(0.4), pan, 'sawtooth');
        break;
      case 'explosion':
        sweep(t, 0.9, 76, 26, v(1.2), pan);
        noiseHit(t, 0.85, hi(420), 0.4, v(1.1), pan, 'lowpass');
        noiseHit(t, 0.15, hi(3600), 0.7, v(0.6), pan, 'highpass');
        break;
      case 'win':
        sweep(t, 0.14, 523, 523, v(0.3), 0, 'triangle');
        sweep(t + 0.16, 0.14, 659, 659, v(0.3), 0, 'triangle');
        sweep(t + 0.32, 0.3, 784, 784, v(0.34), 0, 'triangle');
        break;
      case 'lose':
        sweep(t, 0.16, 392, 392, v(0.3), 0, 'triangle');
        sweep(t + 0.18, 0.36, 311, 290, v(0.32), 0, 'triangle');
        break;
    }
  }

  return {
    init,
    event,
    setVolume(v) { volume = clamp(v, 0, 1); if (masterGain) masterGain.gain.value = 0.55 * volume; },
    get volume() { return volume; },
    /** consume new game sounds relative to a listener */
    ingest(gameSounds, lx, ly, lz, yaw) {
      if (!consumed) return;
      const rx = Math.sin(yaw), ry = -Math.cos(yaw); // right vector
      for (const s of gameSounds) {
        if (consumed.has(s)) continue;
        consumed.add(s);
        const dx = s.x - lx, dy = s.y - ly, dz = (s.z || 0) - lz;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const pan = dist > 0.5 ? (dx * rx + dy * ry) / dist : 0;
        event(s.kind, dist, pan * 0.8);
      }
    },
    toggleMute() {
      muted = !muted;
      return muted;
    },
    get muted() { return muted; },
  };
}




/* ======== src/textures.js ======== */
/* textures.js — procedural texture atlas (zero assets)
 * 4x4 grid of 128px tiles on one 512px canvas, uploaded once at boot.
 * Tile ids: 0 sandstone brick, 1 plaster, 2 concrete, 3 metal panel,
 *           4 crate wood, 5 ground sand, 6 ground stone, 7 site paint,
 *           8 tarp, 9 rust, 15 flat white (untextured entities)
 * The renderer derives world-space UVs from position+normal in the shader,
 * wraps them per-tile with fract() and samples with a 2px inset (no bleed).
 */


const TEX = (() => {
  const TILE = 128, GRID = 4, SIZE = TILE * GRID;
  let seed = 1337;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  // tileable value noise via mirrored lattice
  const lattice = (n) => { const a = []; for (let i = 0; i < n * n; i++) a.push(rnd()); return a; };
  const smooth = (t) => t * t * (3 - 2 * t);
  const vnoise = (lat, n, x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = smooth(x - xi), yf = smooth(y - yi);
    const g = (ix, iy) => lat[((iy % n + n) % n) * n + ((ix % n + n) % n)];
    return g(xi, yi) * (1 - xf) * (1 - yf) + g(xi + 1, yi) * xf * (1 - yf) + g(xi, yi + 1) * (1 - xf) * yf + g(xi + 1, yi + 1) * xf * yf;
  };
  const fbm = (lat, n, x, y, oct) => { let s = 0, a = 0.5, f = 1, tot = 0; for (let o = 0; o < oct; o++) { s += vnoise(lat, n, x * f, y * f) * a; tot += a; a *= 0.5; f *= 2; } return s / tot; };

  const cv = (typeof document !== 'undefined') ? document.createElement('canvas') : null;
  if (cv) { cv.width = SIZE; cv.height = SIZE; }
  const ctx = cv ? cv.getContext('2d') : null;
  const img = ctx ? ctx.createImageData(SIZE, SIZE) : null;
  const px = (tx, ty, x, y, r, g, b) => {
    if (!img) return;
    const i = (((ty * TILE + y) * SIZE) + tx * TILE + x) * 4;
    img.data[i] = Math.max(0, Math.min(255, r | 0));
    img.data[i + 1] = Math.max(0, Math.min(255, g | 0));
    img.data[i + 2] = Math.max(0, Math.min(255, b | 0));
    img.data[i + 3] = 255;
  };
  const eachPx = (tx, ty, fn) => { for (let y = 0; y < TILE; y++) for (let x = 0; x < TILE; x++) { const c = fn(x, y); px(tx, ty, x, y, c[0] * 255, c[1] * 255, c[2] * 255); } };

  // --- tile painters (all tileable: patterns use modulo coords) ---
  const paintSandstone = (tx, ty) => {
    const grain = lattice(16), blot = lattice(8);
    const BH = 32, BW = 64;
    eachPx(tx, ty, (x, y) => {
      const row = Math.floor(y / BH);
      const off = (row % 2) * (BW / 2);
      const bx = ((x + off) % BW), by = y % BH;
      const mortar = (bx < 2 || by < 2) ? 1 : 0;
      const n = fbm(grain, 16, x / TILE * 16, y / TILE * 16, 3) * 0.16 + fbm(blot, 8, x / TILE * 5, y / TILE * 5, 2) * 0.22;
      let v = 0.72 + n - (bx === 2 || by === 2 ? 0.10 : 0) + (bx > BW - 3 || by > BH - 3 ? -0.08 : 0);
      if (mortar) v = 0.52 + n * 0.5;
      const edge = Math.min(bx, BW - bx) < 4 ? 0.06 : 0;
      return [v * 0.82 + edge * 0.3, v * 0.66 + edge * 0.25, v * 0.48];
    });
  };
  const paintPlaster = (tx, ty) => {
    const grain = lattice(24), stain = lattice(6);
    eachPx(tx, ty, (x, y) => {
      const n = fbm(grain, 24, x / TILE * 20, y / TILE * 20, 3) * 0.10;
      const st = fbm(stain, 6, x / TILE * 3.5, y / TILE * 3.5, 3);
      const streak = st > 0.62 ? (st - 0.62) * 0.9 : 0; // vertical grime
      const v = 0.80 + n - streak * 0.35;
      return [v, v * 0.97, v * 0.90];
    });
  };
  const paintConcrete = (tx, ty) => {
    const grain = lattice(32), blot = lattice(8);
    eachPx(tx, ty, (x, y) => {
      const n = fbm(grain, 32, x / TILE * 22, y / TILE * 22, 2) * 0.09 + fbm(blot, 8, x / TILE * 4, y / TILE * 4, 3) * 0.14;
      const v = 0.62 + n;
      return [v, v * 0.99, v * 0.95];
    });
  };
  const paintMetal = (tx, ty) => {
    const grain = lattice(16);
    eachPx(tx, ty, (x, y) => {
      const panelX = x % 64, panelY = y % 64;
      const seam = (panelX < 2 || panelY < 2) ? 0.82 : 1;
      const rivet = ((panelX - 8) % 24 < 3 && (panelY - 8) % 24 < 3 && panelX > 5 && panelY > 5) ? 1.12 : 1;
      const brush = fbm(grain, 16, x / TILE * 40, y / TILE * 3, 2) * 0.08;
      const v = (0.42 + brush) * seam * rivet;
      return [v, v * 1.02, v * 1.08];
    });
  };
  const paintCrate = (tx, ty) => {
    const grain = lattice(32);
    eachPx(tx, ty, (x, y) => {
      const plank = Math.floor(y / 21);
      const inPlank = y % 21;
      const seam = (inPlank < 2) ? 0.55 : 1;
      const warp = fbm(grain, 32, x / TILE * 6, (y + plank * 13) / TILE * 30, 2) * 0.18;
      const frame = (x < 10 || x > TILE - 10 || y < 10 || y > TILE - 10) ? 0.88 : 1;
      const v = (0.50 + warp) * seam * frame;
      return [v * 1.05, v * 0.88, v * 0.68];
    });
  };
  const paintGroundSand = (tx, ty) => {
    const g1 = lattice(48), g2 = lattice(12);
    eachPx(tx, ty, (x, y) => {
      const n = fbm(g1, 48, x / TILE * 30, y / TILE * 30, 2) * 0.13 + fbm(g2, 12, x / TILE * 5, y / TILE * 5, 3) * 0.15;
      const peb = fbm(g1, 48, x / TILE * 60, y / TILE * 60, 1) > 0.78 ? 0.10 : 0;
      const v = 0.74 + n + peb;
      return [v * 1.02, v * 0.88, v * 0.66];
    });
  };
  const paintGroundStone = (tx, ty) => {
    const g1 = lattice(24);
    eachPx(tx, ty, (x, y) => {
      const T2 = 42;
      const tx2 = x % T2, ty2 = y % T2;
      const gap = (tx2 < 2 || ty2 < 2) ? 0.62 : 1;
      const n = fbm(g1, 24, x / TILE * 14, y / TILE * 14, 3) * 0.16;
      const v = (0.66 + n) * gap;
      return [v * 0.98, v * 0.92, v * 0.80];
    });
  };
  const paintSite = (tx, ty) => {
    const g1 = lattice(16);
    eachPx(tx, ty, (x, y) => {
      const n = fbm(g1, 16, x / TILE * 18, y / TILE * 18, 2) * 0.12;
      const stripe = (y % 32 < 14 && x % 128 < 128 && (Math.floor(x / 32) + Math.floor(y / 32)) % 2 === 0) ? 1 : 0;
      const wear = fbm(g1, 16, x / TILE * 7, y / TILE * 7, 2);
      const paint = stripe && wear > 0.35 ? 1 : 0;
      const v = 0.70 + n;
      return paint ? [v * 0.9, v * 0.72, v * 0.30] : [v, v * 0.88, v * 0.68];
    });
  };
  const paintTarp = (tx, ty) => {
    const g1 = lattice(20);
    eachPx(tx, ty, (x, y) => {
      const weave = ((x + y) % 6 < 3 ? 0.06 : 0) + ((x - y) % 6 < 3 ? 0.04 : 0);
      const n = fbm(g1, 20, x / TILE * 12, y / TILE * 12, 2) * 0.16;
      const v = 0.52 + n + weave;
      return [v * 0.72, v * 0.78, v * 0.62];
    });
  };
  const paintRust = (tx, ty) => {
    const g1 = lattice(20), g2 = lattice(8);
    eachPx(tx, ty, (x, y) => {
      const r = fbm(g2, 8, x / TILE * 5, y / TILE * 5, 3);
      const n = fbm(g1, 20, x / TILE * 16, y / TILE * 16, 2) * 0.12;
      const k = Math.min(1, r * 1.4);
      return [(0.38 + n) * (1 + k * 0.7), (0.36 + n) * (1 - k * 0.35), (0.34 + n) * (1 - k * 0.6)];
    });
  };
  const paintFlat = (tx, ty) => eachPx(tx, ty, () => [1, 1, 1]);

  if (ctx && img) {
    paintSandstone(0, 0); paintPlaster(1, 0); paintConcrete(2, 0); paintMetal(3, 0);
    paintCrate(0, 1); paintGroundSand(1, 1); paintGroundStone(2, 1); paintSite(3, 1);
    paintTarp(0, 2); paintRust(1, 2); paintFlat(3, 3);
    ctx.putImageData(img, 0, 0);
  }

  return { TILE, GRID, SIZE, canvas: cv };
})();


/* ======== src/models.js ======== */
/* models.js — meshes authored in Blender 5.2 (tools/blender.js MCP pipeline).
 * Packed per vertex: pos 3xf32le, nrm 3xi8 + 1 pad, mat 1xu8 (10 bytes).
 * Regenerate: node tools/gen_models.js <script.py> <name>
 */

/* ======== src/renderer.js ======== */
/* renderer.js — WebGL2-style (GL1 compatible) renderer
 * Strategy:
 *  - ALL lighting/shadow/AO baked into static vertex colors at load (zero per-frame light math)
 *  - static world = 1 interleaved buffer, 1 draw call
 *  - entities = 1 dynamic buffer, 1 draw call
 *  - particles/decals = 1 dynamic buffer each, 1 draw call
 *  - post: brightpass + separable blur + composite (5 fullscreen passes total, 1 quad each)
 *  - everything sized to run 60fps on integrated GPU from 2017
 */


/* ---------------- shaders ---------------- */

const VS_STD = `
attribute vec3 aPos;
attribute vec3 aNormal;
attribute vec4 aColor;
uniform mat4 uMVP;
varying vec4 vColor;
void main() {
  vColor = aColor;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const FS_STD = `
precision mediump float;
varying vec4 vColor;
void main() {
  gl_FragColor = vColor;
}`;

/* lit/textured pipeline (real browsers; MockGL keeps the simple pair above
 * because its GLSL interpreter is far too slow for per-fragment work) */
const VS_LIT = `
attribute vec3 aPos;
attribute vec3 aNormal;
attribute vec4 aColor;
uniform mat4 uMVP;
varying vec3 vPos;
varying vec3 vN;
varying vec4 vColor;
void main() {
  vPos = aPos;
  vN = aNormal;
  vColor = aColor;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

/* Light transport model:
 *  - STATIC light (hemispherical sky ambient + soft cast sun shadows + one
 *    radiosity bounce) is baked per-vertex at load into vColor.rgb
 *    (albedo * staticLight) — identical maths feeds the MockGL path.
 *  - FS_LIT adds only DYNAMIC light: three point lights (muzzle, explosion,
 *    bomb glow), per-pixel micro-detail, and sun-forward scattering fog.
 */
const FS_LIT = `
precision mediump float;
varying vec3 vPos;
varying vec3 vN;
varying vec4 vColor;
uniform vec3 uCam;
uniform vec3 uSun;
uniform vec3 uLPos;
uniform vec3 uLCol;
uniform vec3 uL2Pos;
uniform vec3 uL2Col;
uniform vec3 uL3Pos;
uniform vec3 uL3Col;
uniform vec3 uFogCol;
uniform float uFlat;
float hash12(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
void main() {
  vec3 col = vColor.rgb;
  vec3 nn = normalize(vN);
  if (uFlat < 0.5) {
    // per-pixel micro-detail: two scales of stable value noise break up the
    // flat baked faces without ever shimmering (floor-quantized, view-stable)
    float m1 = hash12(floor(vPos.xz * 6.5) + floor(vPos.y * 6.5) * 7.0);
    float m2 = hash12(floor(vPos.xz * 1.7) - floor(vPos.y * 1.3) * 3.0);
    col *= 0.955 + 0.055 * m1 + 0.035 * m2 - 0.02;
  }
  // three dynamic point lights (muzzle flash, explosion, blink) — warm keys,
  // double-sided diffuse so backfaces catch spill. uLCol carries premultiplied
  // radiance (power × color); zero power = light off.
  vec3 fd = uLPos - vPos;
  float att = 1.0 / (1.0 + dot(fd, fd) * 1.4);
  col += vColor.rgb * uLCol * att * (0.25 + 0.75 * max(dot(nn, normalize(fd + vec3(0.0001))), 0.0));
  vec3 fd2 = uL2Pos - vPos;
  float att2 = 1.0 / (1.0 + dot(fd2, fd2) * 1.4);
  col += vColor.rgb * uL2Col * att2 * (0.25 + 0.75 * max(dot(nn, normalize(fd2 + vec3(0.0001))), 0.0));
  vec3 fd3 = uL3Pos - vPos;
  float att3 = 1.0 / (1.0 + dot(fd3, fd3) * 1.4);
  col += vColor.rgb * uL3Col * att3 * (0.25 + 0.75 * max(dot(nn, normalize(fd3 + vec3(0.0001))), 0.0));
  // viewmodel (uFlat=1) lives in camera space — world-space lights are garbage
  // there, so instead it reacts to the muzzle flash with a gentle warm lift
  if (uFlat > 0.5) {
    float glow = uLCol.r + uLCol.g + uLCol.b;
    col += vColor.rgb * vec3(1.0, 0.72, 0.42) * glow * 0.16;
  } else {
  // desert fog with forward scattering: haze warms up when looking sunward
  vec3 vd = vPos - uCam;
  float dist = length(vd);
  float fog = 1.0 - exp(-dist * dist * 0.00011);
  float sunAmt = pow(max(dot(vd / max(dist, 0.001), uSun), 0.0), 6.0);
  vec3 fcol = uFogCol * (1.0 + vec3(0.28, 0.14, 0.0) * sunAmt) + vec3(0.10, 0.07, 0.02) * sunAmt;
  col = mix(col, fcol, fog);
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const FS_BRIGHT = `
precision mediump float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform float uThresh;
void main() {
  vec3 c = texture2D(uTex, vUV).rgb;
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  float k = smoothstep(uThresh, uThresh + 0.35, l);
  gl_FragColor = vec4(c * k, 1.0);

const FS_BLUR = `
precision mediump float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uDir;
void main() {
  vec3 c = texture2D(uTex, vUV).rgb * 0.227027;
  c += texture2D(uTex, vUV + uDir * 1.384615).rgb * 0.316216;
  c += texture2D(uTex, vUV - uDir * 1.384615).rgb * 0.316216;
  c += texture2D(uTex, vUV + uDir * 3.230769).rgb * 0.070270;
  c += texture2D(uTex, vUV - uDir * 3.230769).rgb * 0.070270;
  gl_FragColor = vec4(c, 1.0);
}`;

const FS_SKY = `
precision mediump float;
varying vec2 vUV;
uniform vec3 uFwd;
uniform vec3 uRight;
uniform vec3 uUp;
uniform vec3 uSun;
uniform float uTanF;
uniform float uAspect;
uniform float uTime;
float hash21(vec2 hp) {
  return fract(sin(dot(hp, vec2(127.1, 311.7))) * 43758.5453);
}
float vnoise(vec2 vp) {
  vec2 i = floor(vp);
  vec2 f = fract(vp);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
void main() {
  vec2 ndc = vUV * 2.0 - 1.0;
  vec3 dir = normalize(uFwd + uRight * (ndc.x * uTanF * uAspect) + uUp * (ndc.y * uTanF));
  // warm horizon -> deeper blue zenith (more atmospheric depth)
  float h = clamp(dir.z * 1.2 + 0.12, 0.0, 1.0);
  vec3 hor = vec3(0.99, 0.83, 0.58);
  vec3 zen = vec3(0.28, 0.48, 0.82);
  vec3 col = mix(hor, zen, pow(h, 0.75));
  // hazy ground haze band lifts the horizon
  col += vec3(0.30, 0.26, 0.17) * (1.0 - clamp(dir.z * 3.0, 0.0, 1.0)) * 0.25;
  float s = max(dot(dir, uSun), 0.0);
  // cumulus field: project the ray onto a virtual cloud deck, 3-octave fbm
  float cz = max(dir.z, 0.055);
  vec2 cp = dir.xy / cz * 2.6 + vec2(uTime * 0.008, uTime * 0.005);
  float n = vnoise(cp) * 0.55 + vnoise(cp * 2.3 + 11.0) * 0.28 + vnoise(cp * 5.1 - 7.0) * 0.17;
  float cov = smoothstep(0.52, 0.78, n + 0.10);
  cov *= smoothstep(0.02, 0.16, dir.z);          // no clouds touching the ridge
  cov *= 0.82;
  // sun-side clouds catch warm light, far side cools
  float cl = 0.86 + 0.30 * s;
  vec3 cloudCol = vec3(1.02, 0.98, 0.94) * cl + vec3(0.28, 0.18, 0.10) * pow(s, 3.0);
  col = mix(col, cloudCol, cov);
  // sun disc with limb darkening + mie halo
  col += vec3(1.45, 1.18, 0.84) * pow(s, 1400.0) * 5.5;
  col += vec3(1.35, 1.06, 0.72) * pow(s, 60.0) * 0.55;
  col += vec3(0.98, 0.75, 0.45) * pow(s, 5.0) * 0.12;
  // clouds should not erase the sun core
  col += vec3(1.2, 1.0, 0.8) * pow(s, 140.0) * 0.5 * (1.0 - cov * 0.8);
  // distant dune ridge on the horizon (seamless: az is a continuous projection)
  float az = dir.x / (abs(dir.x) + abs(dir.y) + 0.0001);
  float ridge = sin(az * 9.0 + 1.7) * 0.45 + sin(az * 21.0 + 0.4) * 0.3 + sin(az * 41.0 + 2.2) * 0.25;
  float rl = 0.028 + ridge * 0.028;
  float k = smoothstep(rl - 0.012, rl + 0.014, dir.z);
  vec3 ridgeCol = mix(vec3(0.66, 0.55, 0.40), vec3(0.72, 0.62, 0.47), clamp(dir.z * 9.0, 0.0, 1.0));
  col = mix(ridgeCol, col, k);
  gl_FragColor = vec4(col, 1.0);
}`;

const FS_COMPOSITE = `
precision mediump float;
varying vec2 vUV;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uTime;
uniform float uBloomAmt;
uniform vec2 uRes;
uniform vec2 uSunUV;
uniform float uSunVis;
uniform float uExposure;
vec3 aces(vec3 x) {
  // Narkowicz ACES approximation — filmic shoulder, no atan, cheap
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
void main() {
  // lateral chromatic aberration: radial channel offset grows towards edges
  vec2 fromC = vUV - 0.5;
  float r2 = dot(fromC, fromC);
  float ca = 0.0028 * r2;
  vec3 col = vec3(0.0);
  col.r = texture2D(uScene, vUV + fromC * ca).r;
  col.g = texture2D(uScene, vUV).g;
  col.b = texture2D(uScene, vUV - fromC * ca).b;
  // god rays: march toward the projected sun, accumulating ONLY genuinely
  // bright sky (thresholds sit above sunlit sand ~2.0 on this metric, so
  // geometry occludes the shafts instead of smearing ghost copies of itself)
  vec2 grStep = (uSunUV - vUV) * (1.0 / 10.0);
  vec2 grUV = vUV + grStep * 0.5;
  float grAcc = 0.0;
  vec3 gr1 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr1, vec3(1.0, 0.9, 0.75)) - 2.30, 0.0); grUV += grStep;
  vec3 gr2 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr2, vec3(1.0, 0.9, 0.75)) - 2.32, 0.0) * 0.85; grUV += grStep;
  vec3 gr3 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr3, vec3(1.0, 0.9, 0.75)) - 2.34, 0.0) * 0.72; grUV += grStep;
  vec3 gr4 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr4, vec3(1.0, 0.9, 0.75)) - 2.36, 0.0) * 0.60; grUV += grStep;
  vec3 gr5 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr5, vec3(1.0, 0.9, 0.75)) - 2.38, 0.0) * 0.50; grUV += grStep;
  vec3 gr6 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr6, vec3(1.0, 0.9, 0.75)) - 2.40, 0.0) * 0.42; grUV += grStep;
  vec3 gr7 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr7, vec3(1.0, 0.9, 0.75)) - 2.42, 0.0) * 0.35; grUV += grStep;
  vec3 gr8 = texture2D(uScene, grUV).rgb;
  grAcc += max(dot(gr8, vec3(1.0, 0.9, 0.75)) - 2.44, 0.0) * 0.28;
  grAcc = min(grAcc, 2.5);
  col += vec3(1.25, 1.02, 0.72) * (grAcc / 9.0) * uSunVis * 0.85;

  vec3 bloom = texture2D(uBloom, vUV).rgb;
  col += bloom * uBloomAmt * 0.45;
  // filmic tonemap (exposure then ACES) — HDR headroom for lights/sun
  col = aces(col * uExposure);
  // gentle saturation + s-curve contrast with a hair of lift
  float l = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(l), col, 1.10);
  col = clamp((col - 0.5) * 1.05 + 0.502, 0.0, 1.0);
  // warm desert grade: push mids toward amber
  col *= vec3(1.035, 1.0, 0.955);
  // vignette
  vec2 vd = vUV - 0.5;
  col *= 1.0 - dot(vd, vd) * 0.55;
  // fine film grain (animated, subtle)
  float g = fract(sin(dot(vUV * uRes + vec2(uTime * 61.7, uTime * 83.3), vec2(12.9898, 78.233))) * 43758.5453);
  col += (g - 0.5) * 0.020;
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---------------- gl helpers ---------------- */

function compileShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('shader:', gl.getShaderInfoLog(s), src);
  }
  return s;
}

function makeProgram(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compileShader(gl, gl.FRAGMENT_SHADER, fs));
  // Pin attribute locations: GPU drivers otherwise assign them arbitrarily,
  // which scrambles geometry/colors even though the code "looks" correct.
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.bindAttribLocation(p, 1, 'aNormal');
  gl.bindAttribLocation(p, 2, 'aColor');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('program:', gl.getProgramInfoLog(p));
  return p;
}

function progUniforms(gl, p, names) {
  const o = { p };
  for (const n of names) o[n] = gl.getUniformLocation(p, n);
  return o;
}

/* ---------------- geometry baking ---------------- */

/* ---- global light transport constants (shared by bake + entity path) ----
 * The sun is the only directional source; everything else is a hemispherical
 * sky term plus one radiosity bounce, all evaluated per vertex. */
const SUN_DIR = (() => { const l = Math.hypot(MAP.SUN.x, MAP.SUN.y, MAP.SUN.z); return [MAP.SUN.x / l, MAP.SUN.y / l, MAP.SUN.z / l]; })();
const SUN_COL = [0.55, 0.49, 0.39];              // warm key light (irradiance)
const SKY_Z = [0.33, 0.37, 0.44], SKY_H = [0.40, 0.36, 0.31], SKY_G = [0.26, 0.22, 0.16];
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
// hemispherical ambient: sky blue from above, sand bounce from below
const hemiAmb = (n) => {
  const t = Math.abs(n[2]);
  const base = n[2] >= 0 ? mix3(SKY_H, SKY_Z, Math.pow(t, 0.65)) : mix3(SKY_H, SKY_G, Math.pow(t, 0.65));
  return [base[0] * 1.16, base[1] * 1.16, base[2] * 1.20];
};
const sunTerm = (n, vis) => {
  const d = Math.max(n[0] * SUN_DIR[0] + n[1] * SUN_DIR[1] + n[2] * SUN_DIR[2], 0) * vis;
  return [SUN_COL[0] * d, SUN_COL[1] * d, SUN_COL[2] * d];
};

function makeBaker(world) {
  const SUN = (() => { const l = Math.hypot(MAP.SUN.x, MAP.SUN.y, MAP.SUN.z); return [MAP.SUN.x / l, MAP.SUN.y / l, MAP.SUN.z / l]; })();
  const RES = 0.5, N = Math.ceil(world.W / RES);
  // shadow heightfield: max solid top height per cell
  const hf = new Float32Array(N * N);
  for (const s of world.solids) {
    const x0 = Math.floor(s.x / RES), y0 = Math.floor(s.y / RES);
    const x1 = Math.min(N, Math.ceil((s.x + s.w) / RES)), y1 = Math.min(N, Math.ceil((s.y + s.h) / RES));
    for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) {
      const k = j * N + i;
      if (s.h1 > hf[k]) hf[k] = s.h1;
    }
  }
  const hfAt = (x, y) => {
    const i = (x / RES) | 0, j = (y / RES) | 0;
    if (i < 0 || j < 0 || i >= N || j >= N) return 0;
    return hf[j * N + i];
  };
  // sun shadow for a point at height h (march toward sun, absolute steps)
  const shadowAt = (x, y, h) => {
    for (let t = 0.35; t < 26; t += 0.45) {
      const px = x + SUN[0] * t, py = y + SUN[1] * t, pz = h + SUN[2] * t;
      if (hfAt(px, py) > pz + 0.03) return true;
    }
    return false;
  };
  // soft visibility: three dithered marches with penumbra from ray clearance.
  // Returns [0.3 .. 1] — shadowed points keep a third of the direct sun
  // because the penumbra of a ~1m-wide blocker at 5-15m never closes fully.
  const shadowVis = (x, y, h) => {
    let vis = 0;
    for (let j = 0; j < 3; j++) {
      const ox = (j - 1) * 0.16 * -SUN[1], oy = (j - 1) * 0.16 * SUN[0];
      let minGap = 9;
      for (let t = 0.35; t < 24; t += 0.55) {
        const pz = h + SUN[2] * t;
        const g = pz - hfAt(x + SUN[0] * t + ox, y + SUN[1] * t + oy);
        if (g < minGap) minGap = g;
        if (minGap < -0.45) break;
      }
      const v = Math.max(0, Math.min(1, (minGap + 0.05) / 0.30)); // 0 shadow .. 1 lit
      vis += (0.30 + 0.70 * v) / 3;
    }
    return vis;
  };

  const terrH = (x, y) => (fbm(x * 0.11 + 3.7, y * 0.11 - 1.3, 3) - 0.5) * 0.16;

  // proximity helpers (needed by terrain AO and by wall/prop faces)
  const inSolid = (x, y, self) => {
    for (const s of world.solids) {
      if (s === self) continue;
      if (x > s.x - 0.06 && x < s.x + s.w + 0.06 && y > s.y - 0.06 && y < s.y + s.h + 0.06) return s;
    }
    return null;
  };
  const nearCount = (x, y, self, rad) => {
    let n = 0; const r2 = rad * rad;
    for (const s of world.solids) {
      if (s === self) continue;
      const cx = clamp(x, s.x, s.x + s.w), cy = clamp(y, s.y, s.y + s.h);
      if (dist2(x, y, cx, cy) < r2) n++;
    }
    return n;
  };
  // continuous proximity: integer counts jump between adjacent terrain
  // vertices and read as a checkerboard
  const nearSum = (x, y, self, rad) => {
    let s = 0; const r2 = rad * rad;
    for (const w of world.solids) {
      if (w === self) continue;
      const cx = clamp(x, w.x, w.x + w.w), cy = clamp(y, w.y, w.y + w.h);
      const d2 = dist2(x, y, cx, cy);

  };

  const V = []; // interleaved x,y,z,nx,ny,nz,r,g,b,a  (a = (texId+1)/20 for the lit shader)
  const quad = (v0, n, c0, v1, c1, v2, c2, v3, c3, tex) => {
    const a = ((tex === undefined ? 15 : tex) + 1) / 20;
    V.push(v0[0], v0[1], v0[2], n[0], n[1], n[2], c0[0], c0[1], c0[2], a);
    V.push(v1[0], v1[1], v1[2], n[0], n[1], n[2], c1[0], c1[1], c1[2], a);
    V.push(v2[0], v2[1], v2[2], n[0], n[1], n[2], c2[0], c2[1], c2[2], a);
    V.push(v0[0], v0[1], v0[2], n[0], n[1], n[2], c0[0], c0[1], c0[2], a);
    V.push(v2[0], v2[1], v2[2], n[0], n[1], n[2], c2[0], c2[1], c2[2], a);
    V.push(v3[0], v3[1], v3[2], n[0], n[1], n[2], c3[0], c3[1], c3[2], a);
  };

  const MATS = {
    plaster: [0.80, 0.74, 0.62],
    concrete: [0.52, 0.50, 0.46],
    sandstone: [0.68, 0.57, 0.42],
    metal: [0.45, 0.43, 0.40],
  };
  // walls read darker than ground so the map has figure/ground separation
  const TEXPAL = world.cols.map((c) => {
    const m = [MATS.sandstone, MATS.plaster, MATS.concrete][(c.tex || 0) % 3];
    return [m[0] * 0.92, m[1] * 0.92, m[2] * 0.90];
  });

  // one-bounce radiosity: sunlit walls spill warm light onto nearby ground
  const bounceTerr = (px, py) => {
    let br = 0, bg = 0, bb = 0;
    for (const w of world.solids) {
      const cx = clamp(px, w.x, w.x + w.w), cy = clamp(py, w.y, w.y + w.h);
      const d2v = dist2(px, py, cx, cy);
      if (d2v > 49) continue;
      const d = Math.sqrt(d2v) + 0.25;
      const fx = (px - cx) / d, fy = (py - cy) / d;
      const sunOn = Math.max(fx * SUN[0] + fy * SUN[1], 0) * Math.min(w.h1, 4) * 0.45;
      if (sunOn <= 0.01) continue;
      const f = 1 / (1 + d2v * 0.42);
      br += sunOn * f * 0.40; bg += sunOn * f * 0.33; bb += sunOn * f * 0.22;
    }
    return [br, bg, bb];
  };

  // ---- terrain (smooth dunes + baked cast shadows + wall AO) ----
  const cornerColors = []; const cornerVerts = [];
  const STEP = 2;
  if (!globalThis.__NO_TERRAIN) for (let gy = 0; gy < world.H; gy += STEP) {
    for (let gx = 0; gx < world.W; gx += STEP) {
      const x0 = gx, y0 = gy, x1 = gx + STEP, y1 = gy + STEP;
      const h00 = terrH(x0, y0), h10 = terrH(x1, y0), h01 = terrH(x0, y1), h11 = terrH(x1, y1);
      // normal from height gradient (approx central diff)
      const nx = (terrH(x0 - 1, (y0 + y1) / 2) - terrH(x0 + 1, (y0 + y1) / 2)) * 0.5;
      const ny2 = (terrH((x0 + x1) / 2, y0 - 1) - terrH((x0 + x1) / 2, y0 + 1)) * 0.5;
      const nl = Math.hypot(nx, ny2, 1);
      const n = [nx / nl, ny2 / nl, 1 / nl];
      const hem = hemiAmb(n);
      for (const [px, py, ph] of [[x0, y0, h00], [x1, y0, h10], [x0, y1, h01], [x1, y1, h11]]) {
        // smooth multi-octave albedo variation only — never white noise
        const m = fbm(px * 0.09 + 7.3, py * 0.09 - 2.1, 2);
        const m2 = fbm(px * 0.21 - 4.9, py * 0.21 + 8.2, 2);
        let r = 0.82 + 0.055 * m + 0.02 * m2;
        let g = 0.72 + 0.05 * m + 0.016 * m2;
        let b = 0.555 + 0.045 * m + 0.012 * m2;
        // site tint: warm inner patch
        for (const s of [MAP.SITE_A, MAP.SITE_B]) {
          const d = Math.sqrt(dist2(px, py, s.x, s.y));
          if (d < s.r) { const k = 1 - d / s.r; r += 0.055 * k; g += 0.012 * k; b -= 0.028 * k; }
        }
        // light transport: hemispherical sky + soft cast sun + wall bounce
        const ao = 1 / (1 + nearSum(px, py, null, 2.4) * 0.075);
        const vis = shadowVis(px, py, ph + 0.15);
        const st = sunTerm(n, vis);
        const bnc = bounceTerr(px, py);
        const c = [
          r * ao * (hem[0] + st[0] + bnc[0]),
          g * ao * (hem[1] + st[1] + bnc[1]),
          b * ao * (hem[2] + st[2] + bnc[2]), 1,
        ];
        const v = [px, py, ph];
        cornerColors.push(c);
        cornerVerts.push(v);
      }
      // emit quad with 4 corner colors; painted site tiles near site centers
      const scx = (x0 + x1) / 2, scy = (y0 + y1) / 2;
      let gtex = 5; // ground sand
      for (const s of [MAP.SITE_A, MAP.SITE_B]) {
        if (dist2(scx, scy, s.x, s.y) < s.r * s.r * 0.8) gtex = 6; // stone tiles inside sites
      }
      quad(cornerVerts[0], n, cornerColors[0], cornerVerts[1], cornerColors[1], cornerVerts[3], cornerColors[3], cornerVerts[2], cornerColors[2], gtex);
      cornerColors.length = 0; cornerVerts.length = 0;
    }
  }
  // perimeter skirt: frames the map so the edge is a plinth, not a void
  {
    const W = world.W, Hh = world.H, D = 3.5;
    const skirt = [
      [[0, 0], [W, 0], [0, -1]],
      [[W, 0], [W, Hh], [1, 0]],
      [[W, Hh], [0, Hh], [0, 1]],
      [[0, Hh], [0, 0], [-1, 0]],
    ];
    for (const [[ax, ay], [bx, by], nn] of skirt) {
      const cA = [0.40 * 0.9, 0.35 * 0.9, 0.27 * 0.9, 1];
      const cB = [0.30 * 0.9, 0.26 * 0.9, 0.21 * 0.9, 1];
      quad([ax, ay, 0], nn, cA, [bx, by, 0], cA, [bx, by, -D], cB, [ax, ay, -D], cB, 2);
    }
  }
  // ---- walls & props (boxes) ----
  // faces carry the full static transport: hemisphere + soft cast shadow +
  // sand bounce off the ground in front + a base-darkening gradient
  const faceColor = (base, nrm, px, py, pz, self, hFrac) => {
    const nv = hash2((px * 13.7) | 0, (py * 7.3) | 0);
    const varr = 0.96 + 0.07 * nv;
    const vis = shadowVis(px + nrm[0] * 0.25, py + nrm[1] * 0.25, Math.max(pz, 0.35));
    const st = sunTerm(nrm, vis);
    const hem = hemiAmb(nrm);
    // sand bounce: the sunlit ground in front of the face feeds light back
    const lit = shadowVis(px - nrm[0] * 0.9, py - nrm[1] * 0.9, 0.4) * 0.30;
    const bf = 1 + lit * 0.55;
    const bot = 1 - hFrac * 0.16; // walls sit darker where they meet the sand
    return [
      base[0] * varr * (hem[0] + st[0]) * bf * bot,
      base[1] * varr * (hem[1] + st[1]) * bf * bot,
      base[2] * varr * (hem[2] + st[2]) * bf * bot, 1,
    ];
  };
  const box = (s) => {
    const isWall = !s.kind;
    const base = s.kind ? (s.kind === 'sandbag' ? [0.68, 0.60, 0.44] : s.kind === 'crate2' ? [0.52, 0.44, 0.33] : [0.56, 0.46, 0.34]) : TEXPAL[world.cols.indexOf(s) >= 0 ? world.cols.indexOf(s) : 0];
    const tex = s.kind ? (s.kind === 'sandbag' ? 8 : 4) : [0, 1, 2, 3][(s.tex || 0) % 4]; // sandstone/plaster/concrete/metal
    const x0 = s.x, y0 = s.y, x1 = s.x + s.w, y1 = s.y + s.h;
    const h0 = s.h0 || 0, h1 = s.h1 || 3;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    // top (single color across all 4 vertices avoids diagonal splits)
    const cT = faceColor(base, [0, 0, 1], cx, cy, h1, s, 0);
    const vT = [[x0, y0, h1], [x1, y0, h1], [x1, y1, h1], [x0, y1, h1]];
    quad(vT[0], [0, 0, 1], cT, vT[1], cT, vT[2], cT, vT[3], cT, tex);
    // faces: [n, corner verts]
    const faces = [
      { n: [0, 1, 0], pts: [[x0, y1, h0], [x1, y1, h0], [x1, y1, h1], [x0, y1, h1]], px: cx, py: y1 },
      { n: [0, -1, 0], pts: [[x0, y0, h0], [x0, y0, h1], [x1, y0, h1], [x1, y0, h0]], px: cx, py: y0 },
      { n: [-1, 0, 0], pts: [[x0, y0, h0], [x0, y1, h0], [x0, y1, h1], [x0, y0, h1]], px: x0, py: cy },
      { n: [1, 0, 0], pts: [[x1, y0, h0], [x1, y0, h1], [x1, y1, h1], [x1, y1, h0]], px: x1, py: cy },
    ];
    for (const f of faces) {
      // skip if adjacent solid touches (no z-fighting, fewer verts)
      const nb = inSolid(f.px + f.n[0] * 0.1, f.py + f.n[1] * 0.1, s);
      if (nb) continue;
      const cBot = faceColor(base, f.n, f.px, f.py, h0 + 0.3, s, 1);
      const cTop = faceColor(base, f.n, f.px, f.py, h1 - 0.3, s, 0);
      quad(f.pts[0], f.n, cBot, f.pts[1], cBot, f.pts[2], cTop, f.pts[3], cTop, tex);
    }
  };
  if (!globalThis.__NO_BOXES) for (const s of world.solids) box(s);

  // ---- contact shadow decals (translucent buffer) ----
  const D = [];
  const decal2 = (cx, cy, r, a) => {
    const n = 10;
    const cxv = cx, cyv = cy, cz = 0.025;
    const ring = [];
    for (let i = 0; i < n; i++) {
      const t = i / n * Math.PI * 2;
      ring.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r, cz]);
    }
    for (let i = 0; i < n; i++) {
      const p1 = ring[i], p2 = ring[(i + 1) % n];
      const fade = 0.55 + 0.45 * (i / n);
      D.push(cx, cy, cz, 0, 0, 1, 0, 0, 0, a * fade);
      D.push(p1[0], p1[1], p1[2], 0, 0, 1, 0, 0, 0, a * fade);
      D.push(p2[0], p2[1], p2[2], 0, 0, 1, 0, 0, 0, a * fade);
    }
  };
  for (const s of world.solids) {
    if (!s.kind) continue;

    const hh = headH + 0.18;
    quadE([h00[0], h00[1], headH], [0, 0, 1], skinC, [h10[0], h10[1], headH], skinC, [h11[0], h11[1], headH], shade(skinC, 1.05), [h01[0], h01[1], headH], skinC);
    quadE([h00[0], h00[1], headH], fN, skinC, [h00[0], h00[1], hh], skinC, [h10[0], h10[1], hh], skinC, [h10[0], h10[1], headH], skinC);
    quadE([h01[0], h01[1], headH], bN, shade(skinC, 0.85), [h01[0], h01[1], hh], shade(skinC, 0.85), [h11[0], h11[1], hh], shade(skinC, 0.85), [h11[0], h11[1], headH], shade(skinC, 0.85));
    quadE([h00[0], h00[1], headH], lN, shade(skinC, 0.9), [h00[0], h00[1], hh], shade(skinC, 0.9), [h01[0], h01[1], hh], shade(skinC, 0.9), [h01[0], h01[1], headH], shade(skinC, 0.9));
    quadE([h10[0], h10[1], headH], rN, shade(skinC, 1.0), [h10[0], h10[1], hh], shade(skinC, 1.0), [h11[0], h11[1], hh], shade(skinC, 1.0), [h11[0], h11[1], headH], shade(skinC, 1.0));
    // tactical helmet: wider than the skull, dropped over it, with a visor brim
    const helmC = shade(suitC, 0.72);
    const hw2 = 0.125, hd2 = 0.125;
    const m00 = L(-hw2, -hd2, hh - 0.07), m10 = L(-hw2, hd2, hh - 0.07), m11 = L(hw2, hd2, hh - 0.07), m01 = L(hw2, -hd2, hh - 0.07);
    quadE([m00[0], m00[1], hh + 0.04], [0, 0, 1], helmC, [m10[0], m10[1], hh + 0.04], helmC, [m11[0], m11[1], hh + 0.04], shade(helmC, 1.08), [m01[0], m01[1], hh + 0.04], helmC);
    quadE([m00[0], m00[1], hh - 0.07], fN, helmC, [m00[0], m00[1], hh + 0.04], helmC, [m10[0], m10[1], hh + 0.04], helmC, [m10[0], m10[1], hh - 0.07], helmC);
    quadE([m01[0], m01[1], hh - 0.07], bN, shade(helmC, 0.8), [m01[0], m01[1], hh + 0.04], shade(helmC, 0.8), [m11[0], m11[1], hh + 0.04], shade(helmC, 0.8), [m11[0], m11[1], hh - 0.07], shade(helmC, 0.8));
    quadE([m00[0], m00[1], hh - 0.07], lN, shade(helmC, 0.88), [m00[0], m00[1], hh + 0.04], shade(helmC, 0.88), [m01[0], m01[1], hh + 0.04], shade(helmC, 0.88), [m01[0], m01[1], hh - 0.07], shade(helmC, 0.88));
    quadE([m10[0], m10[1], hh - 0.07], rN, shade(helmC, 0.95), [m10[0], m10[1], hh + 0.04], shade(helmC, 0.95), [m11[0], m11[1], hh + 0.04], shade(helmC, 0.95), [m11[0], m11[1], hh - 0.07], shade(helmC, 0.95));
    // visor brim over the eyes (dark strip on the helmet's front face)
    quadE(L(-hw2, hd2 + 0.02, hh - 0.02), fN, shade(helmC, 0.45), L(-hw2, hd2 + 0.02, hh + 0.035), shade(helmC, 0.45), L(hw2, hd2 + 0.02, hh + 0.035), shade(helmC, 0.45), L(hw2, hd2 + 0.02, hh - 0.02), shade(helmC, 0.45));

    // legs (2 boxes, swinging with walk phase)
    const legW = 0.15, legD = 0.13;
    const co = Math.cos(yaw), so = Math.sin(yaw);
    for (const side of [-1, 1]) {
      const sw = side * legSwing;
      const lx = 0.09 * side;
      const hipC = L(lx + Math.sin(sw) * 0.10, 0, hipH);
      const footC = L(lx + Math.sin(sw) * 0.16, 0, z0 + 0.02 + Math.abs(Math.sin(sw)) * 0.07);
      const corners = [
        [hipC[0] - co * legW / 2 + so * legD / 2, hipC[1] - so * legW / 2 - co * legD / 2],
        [hipC[0] - co * legW / 2 - so * legD / 2, hipC[1] - so * legW / 2 + co * legD / 2],
        [footC[0] - co * legW / 2 - so * legD / 2, footC[1] - so * legW / 2 + co * legD / 2],
        [footC[0] - co * legW / 2 + so * legD / 2, footC[1] - so * legW / 2 - co * legD / 2],
      ];
      const lc = shade(suitC, 0.55);
      const zT = hipH, zB = z0 + 0.02;
      // top
      quadE([corners[0][0], corners[0][1], zT], [0, 0, 1], shade(lc, 1.08), [corners[1][0], corners[1][1], zT], shade(lc, 1.08), [corners[2][0], corners[2][1], zT], shade(lc, 1.08), [corners[3][0], corners[3][1], zT], shade(lc, 1.08));
      // 4 sides (hip corners 0,1 ; foot corners 2,3)
      quadE([corners[0][0], corners[0][1], zT], [0, 0, 1], lc, [corners[0][0], corners[0][1], zB], lc, [corners[1][0], corners[1][1], zB], lc, [corners[1][0], corners[1][1], zT], lc);
      quadE([corners[1][0], corners[1][1], zT], [0, 0, 1], lc, [corners[1][0], corners[1][1], zB], lc, [corners[2][0], corners[2][1], zB], shade(lc, 1.05), [corners[2][0], corners[2][1], zT], shade(lc, 1.05));

    }

    const armC = shade(suitC, 0.90);
    const armW = 0.08, armHL = 0.26;
    for (const side of [-1, 1]) {
      const oy = side * 0.155;

      // 12 args shifted into 9 slots, spraying normal-RGB as colors and colors

    const gunC = [0.16, 0.17, 0.19];
    const g0 = L(0.16, -0.06, awH - 0.03), g1 = L(0.46, -0.06, awH + 0.02);

  /* ground shadow blob for a player — emitted into the ALPHA pass so the

  R.addBlobShadow = (x, y, r, a) => {
    const n = 8;
    const ring = [];
    for (let i = 0; i < n; i++) {
      const t = i / n * Math.PI * 2;
      const px = x + Math.cos(t) * r, py = y + Math.sin(t) * r;
      // conform to terrain: a flat ring on sloped ground buries its edges
      ring.push([px, py, baker.terrH(px, py) + 0.02]);
    }
    const zc = baker.terrH(x, y) + 0.02;
    const black = [0, 0, 0, a];
    for (let i = 0; i < n; i++) {
      const p1 = ring[i], p2 = ring[(i + 1) % n];
      R.addParticleQuad([x, y, zc], [0, 0, 1], black, [p1[0], p1[1], p1[2]], black, [p2[0], p2[1], p2[2]], black, [x, y, zc], black, false);
    }
  };

  // explosion scorch: layered dark disc with a ragged outer ring, fades with age
  R.addScorch = (x, y, r, k) => {
    const n = 10;
    const zc = baker.terrH(x, y) + 0.025;
    const inner = [0.05, 0.045, 0.04, 0.72 * k];
    const mid = [0.08, 0.07, 0.06, 0.4 * k];
    const edge = [0.10, 0.09, 0.075, 0.16 * k];
    const ring = [];
    for (let i = 0; i < n; i++) {
      const t = i / n * Math.PI * 2;
      const rag = 0.78 + 0.35 * (Math.sin(i * 12.9898 + 4.1) * 0.5 + 0.5); // stable ragged edge

      const p1 = ring[i], p2 = ring[(i + 1) % n];

  };

  R.resetParticles = () => { R.pAddCount = 0; R.pAlCount = 0; };

  R.addParticleQuad = (v0, n, c0, v1, c1, v2, c2, v3, c3, add) => {
    const verts = add ? R.pAddVerts : R.pAlVerts;

    const o = cnt * 60;
    if (o + 60 > verts.length) return;
    verts[o] = v0[0]; verts[o+1] = v0[1]; verts[o+2] = v0[2]; verts[o+3] = n[0]; verts[o+4] = n[1]; verts[o+5] = n[2]; verts[o+6] = c0[0]; verts[o+7] = c0[1]; verts[o+8] = c0[2]; verts[o+9] = c0[3];
    verts[o+10] = v1[0]; verts[o+11] = v1[1]; verts[o+12] = v1[2]; verts[o+13] = n[0]; verts[o+14] = n[1]; verts[o+15] = n[2]; verts[o+16] = c1[0]; verts[o+17] = c1[1]; verts[o+18] = c1[2]; verts[o+19] = c1[3];
    verts[o+20] = v2[0]; verts[o+21] = v2[1]; verts[o+22] = v2[2]; verts[o+23] = n[0]; verts[o+24] = n[1]; verts[o+25] = n[2]; verts[o+26] = c2[0]; verts[o+27] = c2[1]; verts[o+28] = c2[2]; verts[o+29] = c2[3];
    verts[o+30] = v0[0]; verts[o+31] = v0[1]; verts[o+32] = v0[2]; verts[o+33] = n[0]; verts[o+34] = n[1]; verts[o+35] = n[2]; verts[o+36] = c0[0]; verts[o+37] = c0[1]; verts[o+38] = c0[2]; verts[o+39] = c0[3];

    verts[o+50] = v3[0]; verts[o+51] = v3[1]; verts[o+52] = v3[2]; verts[o+53] = n[0]; verts[o+54] = n[1]; verts[o+55] = n[2]; verts[o+56] = c3[0]; verts[o+57] = c3[1]; verts[o+58] = c3[2]; verts[o+59] = c3[3];

  };

  /* billboarding helper: world-space quad facing camera */
  R.billboardQuad = (cx, cy, cz, sizeX, sizeY, color, add) => {
    const cam = R.cam;
    // camera right & up in world
    const dx = cam.x - cx, dy = cam.y - cy, dz = cam.z - cz;
    const dl = Math.hypot(dx, dy, dz) || 1;
    const fx = dx / dl, fy = dy / dl, fz = dz / dl;
    // right = up(0,1,0) x f
    let rx = -fz, ry = 0, rz = fx;
    const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
    // up = f x right
    const ux = fy * rz - fz * ry, uy = fz * rx - fx * rz, uz = fx * ry - fy * rx;
    const hx = sizeX / 2, hy = sizeY / 2;

    const v1 = [cx + rx * hx - ux * hy, cy + ry * hx - uy * hy, cz + rz * hx - uz * hy];
    const v2 = [cx + rx * hx + ux * hy, cy + ry * hx + uy * hy, cz + rz * hx + uz * hy];
    const v3 = [cx - rx * hx + ux * hy, cy - ry * hx + uy * hy, cz - rz * hx + uz * hy];

  R.draw = () => {

    for (const L of R.lights) L.pow *= L === R.lights[1] ? 0.86 : 0.78; // muzzle decays fast, explosion lingers
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo);
    gl.viewport(0, 0, rt.w, rt.h);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.BLEND);

    M4.lookAt(R.view, R.cam.x, R.cam.y, R.cam.z, R.cam.tx ?? R.cam.x, R.cam.ty ?? R.cam.y, R.cam.tz ?? R.cam.z);

    // 0) gradient sky (fullscreen ray pass; world overdraws it)
    {
      const fx = (R.cam.tx ?? R.cam.x) - R.cam.x, fy = (R.cam.ty ?? R.cam.y) - R.cam.y, fz = (R.cam.tz ?? R.cam.z) - R.cam.z;
      const fl = Math.hypot(fx, fy, fz) || 1;
      const fX = fx / fl, fY = fy / fl, fZ = fz / fl;

      const uX = rY2 * fZ, uY = -rX * fZ, uZ = rX * fY - rY2 * fX;
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(R.sky.p);
      gl.uniform3f(R.sky.uFwd, fX, fY, fZ);
      gl.uniform3f(R.sky.uRight, rX, rY2, 0);
      gl.uniform3f(R.sky.uUp, uX, uY, uZ);
      gl.uniform3f(R.sky.uSun, MAP.SUN.x, MAP.SUN.y, MAP.SUN.z);
      gl.uniform1f(R.sky.uTanF, Math.tan((R.cam.fov || 70 * Math.PI / 180) / 2));
      gl.uniform1f(R.sky.uAspect, rt.w / rt.h);
      gl.uniform1f(R.sky.uTime, (R.frame * 0.016) % 3600);

      // the ray march only when it is genuinely IN frame — a lenient gate lets
      // off-screen suns smear light across the whole scene (ghost-wall wash).
      const sf = fX * SUNV[0] / sl + fY * SUNV[1] / sl + fZ * SUNV[2] / sl;
      if (sf > 0.55) {
        const sr = rX * SUNV[0] / sl + rY2 * SUNV[1] / sl;
        const su = uX * SUNV[0] / sl + uY * SUNV[1] / sl + uZ * SUNV[2] / sl;
        const tanF = Math.tan((R.cam.fov || 70 * Math.PI / 180) / 2);
        const uvx = 0.5 + (sr / (sf * tanF * (rt.w / rt.h))) * 0.5;
        const uvy = 0.5 - (su / (sf * tanF)) * 0.5;

        const inX = clamp((uvx + 0.25) / 0.25, 0, 1) * clamp((1.25 - uvx) / 0.25, 0, 1);
        const inY = clamp((uvy + 0.25) / 0.25, 0, 1) * clamp((1.25 - uvy) / 0.25, 0, 1);
        R.sunUV = [uvx, uvy];
        R.sunVis = clamp((sf - 0.55) / 0.30, 0, 1) * inX * inY;
      } else {
        R.sunVis = 0.0;
      }
      if (!globalThis.__SIM_NOSKY) {
        gl.bindBuffer(gl.ARRAY_BUFFER, R.fsQuad);

        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.disableVertexAttribArray(1);
        gl.disableVertexAttribArray(2);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      gl.enable(gl.DEPTH_TEST);
    }

    // 1) static world (textured + lit)
    R.litUniforms(R.std, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, R.staticBuf);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
    gl.uniformMatrix4fv(R.std.uMVP, false, R.mvp);
    gl.drawArrays(gl.TRIANGLES, 0, R.count);

    // 2) entities
    if (R.entCount > 0) {
      R.litUniforms(R.ent, 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, R.entBuf);
      gl.bufferData(gl.ARRAY_BUFFER, R.entVerts, gl.DYNAMIC_DRAW);
      // rebind attribute pointers: they capture the CURRENT buffer, so without
      // this the entity pass would re-render the static world buffer
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
      gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
      gl.uniformMatrix4fv(R.ent.uMVP, false, R.mvp);
      gl.drawArrays(gl.TRIANGLES, 0, R.entCount * 6);
    }

    // 3) decals + alpha particles (normal blend)
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.useProgram(R.partAlpha.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, R.decalBuf);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
    gl.uniformMatrix4fv(R.partAlpha.uMVP, false, R.mvp);
    gl.drawArrays(gl.TRIANGLES, 0, R.decalCount);
    if (R.pAlCount > 0) {
      gl.bindBuffer(gl.ARRAY_BUFFER, R.pAlBuf);
      gl.bufferData(gl.ARRAY_BUFFER, R.pAlVerts, gl.DYNAMIC_DRAW);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
      gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
      gl.drawArrays(gl.TRIANGLES, 0, R.pAlCount * 6);
    }

    // 4) additive particles (muzzle flash, tracers)
    if (R.pAddCount > 0) {
      gl.useProgram(R.partAdd.p);
      gl.bindBuffer(gl.ARRAY_BUFFER, R.pAddBuf);
      gl.bufferData(gl.ARRAY_BUFFER, R.pAddVerts, gl.DYNAMIC_DRAW);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
      gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
      gl.uniformMatrix4fv(R.partAdd.uMVP, false, R.mvp);
      gl.drawArrays(gl.TRIANGLES, 0, R.pAddCount * 6);
    }
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    // 5) viewmodel (camera-space, own depth range so walls never clip it)
    if (R.vmBuf && R.vmDraw) {
      gl.clear(gl.DEPTH_BUFFER_BIT);
      R.litUniforms(R.ent, 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, R.vmBuf);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
      gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
      gl.uniformMatrix4fv(R.ent.uMVP, false, R.vmMVP);
      gl.drawArrays(gl.TRIANGLES, 0, R.vmCount);
    }

    // ---- post FX ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, R.W, R.H);
    gl.disable(gl.DEPTH_TEST);

    gl.bindBuffer(gl.ARRAY_BUFFER, R.fsQuad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disableVertexAttribArray(1);
    gl.disableVertexAttribArray(2);

    // bright pass
    gl.useProgram(R.bright.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rt.tex);
    gl.uniform1i(R.bright.uTex, 0);
    gl.uniform1f(R.bright.uThresh, 0.72);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.rtBloom.fbo);
    gl.viewport(0, 0, R.rtBloom.w, R.rtBloom.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // blur H
    gl.useProgram(R.blur.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.rtBloom2.fbo);
    gl.bindTexture(gl.TEXTURE_2D, R.rtBloom.tex);
    gl.uniform1i(R.blur.uTex, 0);
    gl.uniform2f(R.blur.uDir, 1.0 / R.rtBloom.w, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // blur V
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.rtBloom.fbo);
    gl.bindTexture(gl.TEXTURE_2D, R.rtBloom2.tex);
    gl.uniform2f(R.blur.uDir, 0, 1.0 / R.rtBloom.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // composite
    gl.useProgram(R.comp.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, R.W, R.H);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rt.tex);
    gl.uniform1i(R.comp.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, R.rtBloom.tex);
    gl.uniform1i(R.comp.uBloom, 1);
    gl.uniform1f(R.comp.uTime, (R.frame * 0.016) % 100);
    gl.uniform1f(R.comp.uBloomAmt, globalThis.__NO_BLOOM ? 0 : 0.55);
    gl.uniform2f(R.comp.uRes, R.W, R.H);
    if (R.comp.uSunUV) gl.uniform2f(R.comp.uSunUV, R.sunUV ? R.sunUV[0] : 0.5, R.sunUV ? R.sunUV[1] : 0.5);
    if (R.comp.uSunVis) gl.uniform1f(R.comp.uSunVis, globalThis.__NO_RAYS ? 0 : (R.sunVis || 0));
    if (R.comp.uExposure) gl.uniform1f(R.comp.uExposure, 1.38);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    R.frame++;
  };

  return R;
}




/* ======== src/game.js ======== */
/* game.js — simulation: players, weapons, rounds, economy, bomb, bots, effects
 * Deterministic core: all randomness via game.rng; fixed timestep 120Hz.
 */


const FPS = 120;          // sim steps per second
const STEP = 1 / FPS;
const PLAYER_R = 0.45;
const PLAYER_H = 1.8;

const TEAM = { CT: 0, T: 1 };
const TEAM_NAME = ['Counter-Terrorists', 'Terrorists'];
const TEAM_COL = {

  [TEAM.T]: { body: [0.55, 0.40, 0.24], suit: [0.42, 0.30, 0.18] },

const WEAPONS = {
