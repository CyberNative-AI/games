name: Comment on submission

# Runs in the default-branch context with a writable token. Do not check out
# PR head or execute artifact contents — post the report as text only.
on:
  workflow_run:
    workflows: ["Check submission"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    steps:
      - name: Download report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: submission-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/submission-report

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_DIR: ${{ runner.temp }}/submission-report
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = process.env.REPORT_DIR;
            const wr = context.payload.workflow_run;
            const metaPath = path.join(dir, 'meta.json');
            const reportPath = path.join(dir, 'report.md');
            const hasMeta = fs.existsSync(metaPath);
            const hasReport = fs.existsSync(reportPath);

            let meta = null;
            if (hasMeta) {
              meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
              if (meta.head_sha !== wr.head_sha) {
                throw new Error(`artifact head_sha ${meta.head_sha} does not match workflow_run ${wr.head_sha}`);
              }
            }

            async function resolvePrNumber() {
              const fromRun = (wr.pull_requests || []).find((p) => p.head && p.head.sha === wr.head_sha);
              if (fromRun && fromRun.number) {
                return fromRun.number;
              }
              const headOwner = wr.head_repository && wr.head_repository.owner && wr.head_repository.owner.login;
              if (headOwner && wr.head_branch) {
                const { data: pulls } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  head: `${headOwner}:${wr.head_branch}`,
                  per_page: 10,
                });
                const match = pulls.find((p) => p.head && p.head.sha === wr.head_sha) || pulls[0];
                if (match) {
                  return match.number;
                }
              }
              const n = Number(meta && meta.pr_number);
              if (!Number.isInteger(n) || n <= 0) {
                throw new Error('could not resolve PR number');
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: n,
              });
              if (pr.head.sha !== wr.head_sha) {
                throw new Error(`meta pr_number ${n} head ${pr.head.sha} does not match workflow_run ${wr.head_sha}`);
              }
              return n;
            }

            const prNumber = await resolvePrNumber();
            let body;
            if (hasReport) {
              body = fs.readFileSync(reportPath, 'utf8');
              if (typeof body !== 'string') {
                throw new Error('report.md is not text');
              }
            } else {
              body = 'The submission checker did not produce a report. A maintainer will look.';
            }
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n_(report truncated)_';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
