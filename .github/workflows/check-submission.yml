name: Queue private submission review

on:
  pull_request_target:
    branches: [main]
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Do not check out or execute the pull-request tree here. The dispatch
      # payload binds the private worker to this exact immutable commit.
      - name: Start private intake for this exact commit
        uses: actions/github-script@v7
        env:
          INTAKE_REPOSITORY: ${{ secrets.CYBERNATIVE_INTAKE_REPOSITORY }}
        with:
          github-token: ${{ secrets.CYBERNATIVE_INTAKE_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = (process.env.INTAKE_REPOSITORY || '').split('/');
            if (!owner || !repo) throw new Error('private review dispatch is not configured');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'submission-review-request',
              client_payload: {
                base_repo: context.repo.owner + '/' + context.repo.repo,
                base_sha: context.payload.pull_request.base.sha,
                head_repo: context.payload.pull_request.head.repo.full_name,
                head_sha: context.payload.pull_request.head.sha,
                pr_number: context.payload.pull_request.number,
              },
            });
