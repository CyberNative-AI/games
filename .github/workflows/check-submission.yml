name: Queue private submission review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'submissions/**'
      - '.github/workflows/check-submission.yml'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue the immutable public revision
        uses: actions/github-script@v7
        env:
          # Repository Actions configuration holds the private endpoint; this
          # public tree must not disclose the private custody location.
          INTAKE_DISPATCH_ENDPOINT: ${{ vars.GAMES_INTAKE_DISPATCH_ENDPOINT }}
        with:
          github-token: ${{ secrets.GAMES_INTAKE_DISPATCH_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;
            const baseRepo = context.payload.repository?.full_name;
            const baseSha = pullRequest?.base?.sha;
            const headRepo = pullRequest?.head?.repo?.full_name;
            const headSha = pullRequest?.head?.sha;
            const endpoint = process.env.INTAKE_DISPATCH_ENDPOINT;
            if (baseRepo !== 'CyberNative-AI/games'
                || !/^[a-f0-9]{40}$/.test(baseSha || '')
                || !/^[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(headRepo || '')
                || !/^[a-f0-9]{40}$/.test(headSha || '')
                || !/^https:\/\/api\.github\.com\/repos\/[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*\/dispatches$/.test(endpoint || '')) {
              core.setFailed('submission revision is unavailable or malformed');
              return;
            }
            await github.request(`POST ${endpoint}`, {
              event_type: 'submission-review-request',
              client_payload: { base_repo: baseRepo, base_sha: baseSha, head_repo: headRepo, head_sha: headSha },
            });
