name: Check submission

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/**"

# Read-only on pull_request, including forks. GitHub will not grant
# pull-requests: write to GITHUB_TOKEN for fork PRs; do not post comments here.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fork PRs supply their own tree. Restore check tooling from the
      # base branch so a submitter cannot hand themselves a green check.
      # The workflow file that GitHub already selected can still differ;
      # this only pins the scripts we then run. Do not use pull_request_target.
      - name: Restore check tooling from the base branch
        run: git checkout "origin/${{ github.event.pull_request.base.ref }}" -- .github/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static submission checks
        id: checks
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          REPORT_OUTPUT_PATH: ${{ runner.temp }}/report.md
        run: |
          set +e
          python3 .github/scripts/check_submission.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stage report artifact
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXIT_CODE: ${{ steps.checks.outputs.exit_code }}
          REPORT_MD: ${{ runner.temp }}/report.md
          ARTIFACT_DIR: ${{ runner.temp }}/submission-report
        run: |
          mkdir -p "$ARTIFACT_DIR"
          if [ -f "$REPORT_MD" ]; then
            cp "$REPORT_MD" "$ARTIFACT_DIR/report.md"
            REPORT_OK=true
          else
            printf '%s\n' 'The submission checker did not finish. A maintainer has been notified.' > "$ARTIFACT_DIR/report.md"
            REPORT_OK=false
          fi
          export REPORT_OK
          python3 - <<'PY'
          import json, os, pathlib
          artifact = pathlib.Path(os.environ["ARTIFACT_DIR"])
          raw = (os.environ.get("EXIT_CODE") or "").strip()
          try:
              check_exit_code = int(raw)
          except ValueError:
              check_exit_code = 1
          meta = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "head_repo": os.environ["HEAD_REPO"],
              "check_exit_code": check_exit_code,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "report_ok": os.environ.get("REPORT_OK") == "true",
          }
          (artifact / "meta.json").write_text(json.dumps(meta) + "\n", encoding="utf-8")
          PY

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-report
          path: ${{ runner.temp }}/submission-report
          if-no-files-found: error
          retention-days: 1

      - name: Fail job if checks did not pass
        if: steps.checks.outputs.exit_code != '0'
        run: exit 1
