name: Queue private submission review

on:
  pull_request_target:
    branches: [main]
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Do not check out or execute the pull-request tree here. Only the
      # validated immutable refs cross into the private executor.
      - name: Queue the exact candidate for private review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GAMES_INTAKE_DISPATCH_TOKEN }}
          script: |
            const baseRepo = context.payload.repository?.full_name;
            const headRepo = context.payload.pull_request?.head?.repo?.full_name;
            const headSha = context.payload.pull_request?.head?.sha;
            const repoName = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
            const sha = /^[a-f0-9]{40}$/;
            if (baseRepo !== 'CyberNative-AI/games' || !repoName.test(headRepo || '') || !sha.test(headSha || '')) {
              throw new Error('invalid immutable submission references');
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'CyberNative-AI',
              repo: 'ops',
              event_type: 'submission-review-request',
              client_payload: { head_repo: headRepo, head_sha: headSha, base_repo: baseRepo },
            });
