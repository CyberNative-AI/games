name: Check submission

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static submission checks
        id: checks
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          REPORT_OUTPUT_PATH: ${{ runner.temp }}/report.md
        run: |
          set +e
          python3 .github/scripts/check_submission.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.REPORT_PATH;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          REPORT_PATH: ${{ runner.temp }}/report.md

      - name: Fail job if checks did not pass
        if: steps.checks.outputs.exit_code != '0'
        run: exit 1
