name: Test submission checker

# Guards the checker itself, so a later edit cannot silently re-open the
# false positives and false negatives its fixtures pin down.
#
# Deliberately never runs code from a fork: the pull_request job is gated on
# the head repo being this one, so only branches a maintainer pushed here are
# ever executed. Submission PRs are checked by check-submission.yml, which
# reads files and runs nothing from the submission.
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-checker.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-checker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker fixture tests
        run: python3 .github/scripts/test_check_submission.py
